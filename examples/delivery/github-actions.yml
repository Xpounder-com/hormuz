# Copy into your own repository after qualifying its gateway and source revision.
# This trusted reporter differs from the signed GitHub App connector.
name: Report an actual check to Hormuz
on:
  workflow_dispatch:
    inputs:
      work_id:
        description: Work ID owned by this workflow's Hormuz identity
        required: true
        type: string
      completes_work:
        description: This passing check is the previously declared whole-job completion criterion
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: hormuz-delivery-${{ github.repository }}
  cancel-in-progress: false
jobs:
  check-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out your code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run your actual acceptance check
        id: check
        continue-on-error: true
        run: python -m unittest discover -s tests -v
      - name: Require an immutable reviewed Hormuz source revision
        env:
          SOURCE_REVISION: ${{ vars.HORMUZ_SOURCE_REVISION }}
        run: |
          [[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]
      - name: Check out the Hormuz client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Xpounder-com/hormuz
          ref: ${{ vars.HORMUZ_SOURCE_REVISION }}
          path: .hormuz-client
          persist-credentials: false
      - name: Install the candidate client
        id: client
        run: python -m pip --disable-pip-version-check install --timeout 30 --retries 2 ./.hormuz-client
      - name: Report the actual result
        if: always() && steps.client.outcome == 'success' && steps.check.outcome != ''
        env:
          HORMUZ_GATEWAY_URL: ${{ vars.HORMUZ_GATEWAY_URL }}
          HORMUZ_TOKEN: ${{ secrets.HORMUZ_TOKEN }}
          WORK_ID: ${{ inputs.work_id }}
          CHECK_RESULT: ${{ steps.check.outcome }}
          COMPLETES_WORK: ${{ inputs.completes_work }}
        run: |
          flags=()
          if [[ "$COMPLETES_WORK" == true ]]; then flags+=(--complete-on-pass); fi
          python .hormuz-client/tools/ai_work_delivery_examples.py report \
            --work-id "$WORK_ID" --result "$CHECK_RESULT" \
            --reference "github-run/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            "${flags[@]}" --execute
      - name: Preserve a failed check as workflow failure
        if: always() && steps.check.outcome != 'success'
        run: exit 1
