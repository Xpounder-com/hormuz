name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", "marketing/**", "README.md", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", "marketing/**", "README.md", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Website checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked website dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Test paths, contact privacy, claims, and recordings
        run: npm test
      - name: Build static GitHub Pages export
        run: npm run build
      - name: Type-check the website
        run: npm run typecheck
      - name: Verify links, assets, canonical URLs, and downloads
        run: npm run verify
      - name: Upload the Pages artifact
        if: github.repository == 'Xpounder-com/hormuz' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/out

  deploy:
    name: Publish project site
    if: github.repository == 'Xpounder-com/hormuz' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
