name: Verify signed OCI cross-version rollback

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-cross-version-rollback
  cancel-in-progress: false

jobs:
  verify:
    name: Signed OCI cross-version rollback
    if: ${{ github.repository == 'Xpounder-com/hormuz' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install the pinned Cosign verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install checksum-pinned ORAS
        env:
          ORAS_ARCHIVE: oras_1.3.4_linux_amd64.tar.gz
          ORAS_SHA256: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$ORAS_ARCHIVE" \
            "https://github.com/oras-project/oras/releases/download/v1.3.4/$ORAS_ARCHIVE"
          printf '%s  %s\n' "$ORAS_SHA256" "$RUNNER_TEMP/$ORAS_ARCHIVE" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$ORAS_ARCHIVE" -C "$RUNNER_TEMP" oras
          chmod 0700 "$RUNNER_TEMP/oras"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Exercise exact-digest retention and rollback
        env:
          HORMUZ_OCI_ROLLBACK_EVIDENCE_DIR: ${{ runner.temp }}/hormuz-oci-rollback-evidence
        run: ./tools/verify_oci_cross_version_rollback.sh

      - name: Preserve the content-free rollback evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-oci-cross-version-rollback
          path: ${{ runner.temp }}/hormuz-oci-rollback-evidence/summary.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
          include-hidden-files: false
