name: Native client contracts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-client-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Shared contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify existing gateway expectations
        run: python -m unittest -v tests.test_native_client_contracts
      - name: Install pinned Rust toolchain
        working-directory: clients/rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Check Rust formatting
        working-directory: clients/rust
        run: cargo fmt --all -- --check
      - name: Verify shared native Rust libraries
        working-directory: clients/rust
        run: cargo test --workspace --locked
      - name: Lint shared Rust libraries
        working-directory: clients/rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build native Windows preview
        if: runner.os == 'Windows'
        working-directory: clients/rust
        run: cargo build -p hormuz-windows --release --locked
      - name: Exercise native Windows window lifecycle
        if: runner.os == 'Windows'
        working-directory: clients/rust
        shell: pwsh
        run: ./windows/verify-smoke.ps1 -Executable ./target/release/hormuz-windows.exe
      - name: Verify Windows accessibility and collect preview measurements
        if: runner.os == 'Windows'
        working-directory: clients/rust
        shell: pwsh
        env:
          HORMUZ_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./windows/verify-acceptance.ps1 -Executable ./target/release/hormuz-windows.exe -Output ./target/release/windows-acceptance.json
      - name: Reject invalid Windows acceptance targets and preserve evidence
        if: runner.os == 'Windows'
        working-directory: clients/rust
        shell: powershell
        run: ./windows/test-acceptance-failure.ps1
      - name: Check Windows runtime dependencies
        if: runner.os == 'Windows'
        working-directory: clients/rust
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw "MSVC dependency inspector is unavailable." }
          $dependencies = & $dumpbin /DEPENDENTS target/release/hormuz-windows.exe
          if ($LASTEXITCODE -ne 0) { throw "PE dependency inspection failed." }
          $imports = @($dependencies | ForEach-Object {
            if ($_ -match '^\s+([A-Za-z0-9_.-]+\.dll)\s*$') { $Matches[1].ToLowerInvariant() }
          } | Sort-Object -Unique)
          if ($imports.Count -eq 0) { throw "PE imports were not found." }
          if ($imports | Where-Object { $_ -match '^(vcruntime|msvcp|concrt)' }) {
            throw "Preview unexpectedly requires a Visual C++ redistributable."
          }
          $imports | Set-Content target/release/windows-imports.txt
          $imports | ForEach-Object { Write-Output "windows_import=$_" }
      - name: Record Windows development artifact provenance
        if: runner.os == 'Windows'
        working-directory: clients/rust
        shell: pwsh
        env:
          HORMUZ_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $metadata = @{
            schema_version = 1
            artifact_kind = "unsigned_synthetic_preview"
            source_commit = (git rev-parse HEAD).Trim()
            proposed_head = $env:HORMUZ_PR_HEAD
            target = "x86_64-pc-windows-msvc"
            compiler = (rustc --version).Trim()
            os = [Environment]::OSVersion.VersionString
            sha256 = (Get-FileHash target/release/hormuz-windows.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            native_smoke = "passed"
            external_ui_automation = "passed"
            acceptance_sha256 = (Get-FileHash target/release/windows-acceptance.json -Algorithm SHA256).Hash.ToLowerInvariant()
            static_msvc_crt = $true
            direct_dll_imports = @(Get-Content target/release/windows-imports.txt)
            manual_platform_acceptance = "pending"
          }
          $metadata | ConvertTo-Json | Set-Content target/release/windows-build.json
      - name: Save Windows development preview
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-windows-preview-${{ github.sha }}
          path: |
            clients/rust/target/release/hormuz-windows.exe
            clients/rust/target/release/windows-build.json
            clients/rust/target/release/windows-acceptance.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify existing Swift expectations
        if: runner.os == 'macOS'
        run: swift test --package-path clients/macos --filter SharedContractTests
