name: Mac controlled-pilot operations

on:
  workflow_dispatch:
    inputs:
      candidate_distribution_run_url:
        description: Successful candidate Mac signed-distribution workflow URL
        required: true
        type: string
      previous_distribution_run_url:
        description: Immediately preceding successful Mac signed-distribution workflow URL
        required: true
        type: string
      gateway_deployment_evidence_url:
        description: Successful external-pilot deployment-evidence workflow URL
        required: true
        type: string

permissions: {}

concurrency:
  group: macos-pilot-operations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Authorize and bind exact pilot inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: macos-pilot-operations
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require reviewed default-branch source
        env:
          HORMUZ_EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$HORMUZ_EXPECTED_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Authenticate distribution and gateway evidence
        env:
          GH_TOKEN: ${{ github.token }}
          HORMUZ_CANDIDATE_RUN_URL: ${{ inputs.candidate_distribution_run_url }}
          HORMUZ_PREVIOUS_RUN_URL: ${{ inputs.previous_distribution_run_url }}
          HORMUZ_GATEWAY_DEPLOYMENT_URL: ${{ inputs.gateway_deployment_evidence_url }}
        run: |
          set -euo pipefail
          umask 077
          HORMUZ_STAGE="$RUNNER_TEMP/hormuz-macos-pilot-inputs"
          mkdir "$HORMUZ_STAGE"
          python3 -I tools/macos_pilot_operations.py prepare \
            --candidate-distribution-run-url "$HORMUZ_CANDIDATE_RUN_URL" \
            --previous-distribution-run-url "$HORMUZ_PREVIOUS_RUN_URL" \
            --gateway-deployment-evidence-url "$HORMUZ_GATEWAY_DEPLOYMENT_URL" \
            --expected-source-commit "$GITHUB_SHA" \
            --output "$HORMUZ_STAGE/macos-pilot-inputs.json"
          install -m 0700 tools/collect_macos_clean_machine.sh \
            "$HORMUZ_STAGE/collect_macos_clean_machine.sh"
          install -m 0700 tools/collect_macos_session_and_clients.sh \
            "$HORMUZ_STAGE/collect_macos_session_and_clients.sh"
      - name: Transfer only authenticated metadata and reviewed collectors
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-macos-pilot-inputs-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hormuz-macos-pilot-inputs
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  arm64-operations:
    name: Clean Apple Silicon install, lifecycle and client recovery
    needs: prepare
    runs-on: [self-hosted, macOS, hormuz-pilot-clean-arm64]
    timeout-minutes: 90
    permissions:
      actions: read
      contents: none
    steps:
      - name: Download authenticated operation inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hormuz-macos-pilot-inputs-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hormuz-macos-pilot-inputs
      - name: Verify Safari download, quarantine, Gatekeeper, install and launch
        run: |
          set -euo pipefail
          umask 077
          HORMUZ_RECORDS="$RUNNER_TEMP/hormuz-macos-arm64-records"
          mkdir "$HORMUZ_RECORDS"
          /bin/bash "$RUNNER_TEMP/hormuz-macos-pilot-inputs/collect_macos_clean_machine.sh" \
            "$RUNNER_TEMP/hormuz-macos-pilot-inputs/macos-pilot-inputs.json" \
            arm64 "$HORMUZ_RECORDS/clean-machine.json"
      - name: Exercise Keychain lifecycle and pinned official clients
        run: |
          set -euo pipefail
          /bin/bash "$RUNNER_TEMP/hormuz-macos-pilot-inputs/collect_macos_session_and_clients.sh" \
            "$RUNNER_TEMP/hormuz-macos-pilot-inputs/macos-pilot-inputs.json" \
            "$RUNNER_TEMP/hormuz-macos-arm64-records"
      - name: Transfer only content-free Apple Silicon records
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-macos-pilot-arm64-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hormuz-macos-arm64-records
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  x86-64-install:
    name: Clean Intel install and launch
    needs: prepare
    runs-on: [self-hosted, macOS, hormuz-pilot-clean-x86_64]
    timeout-minutes: 20
    permissions:
      actions: read
      contents: none
    steps:
      - name: Download authenticated operation inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hormuz-macos-pilot-inputs-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hormuz-macos-pilot-inputs
      - name: Verify Safari download, quarantine, Gatekeeper, install and launch
        run: |
          set -euo pipefail
          umask 077
          HORMUZ_RECORDS="$RUNNER_TEMP/hormuz-macos-x86-64-records"
          mkdir "$HORMUZ_RECORDS"
          /bin/bash "$RUNNER_TEMP/hormuz-macos-pilot-inputs/collect_macos_clean_machine.sh" \
            "$RUNNER_TEMP/hormuz-macos-pilot-inputs/macos-pilot-inputs.json" \
            x86_64 "$HORMUZ_RECORDS/clean-machine.json"
      - name: Transfer only the content-free Intel record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-macos-pilot-x86-64-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hormuz-macos-x86-64-records
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  assemble:
    name: Assemble exact content-free operations evidence
    needs: [prepare, arm64-operations, x86-64-install]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require unchanged default-branch source
        env:
          HORMUZ_EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$HORMUZ_EXPECTED_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Download authenticated inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hormuz-macos-pilot-inputs-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hormuz-macos-pilot-inputs
      - name: Download Apple Silicon records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hormuz-macos-pilot-arm64-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hormuz-macos-arm64-records
      - name: Download Intel record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hormuz-macos-pilot-x86-64-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hormuz-macos-x86-64-records
      - name: Validate and assemble the sole retained proof
        env:
          HORMUZ_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          umask 077
          HORMUZ_OUTPUT="$RUNNER_TEMP/hormuz-macos-pilot-operations"
          mkdir "$HORMUZ_OUTPUT"
          python3 -I tools/macos_pilot_operations.py assemble \
            --inputs "$RUNNER_TEMP/hormuz-macos-pilot-inputs/macos-pilot-inputs.json" \
            --arm64-record "$RUNNER_TEMP/hormuz-macos-arm64-records/clean-machine.json" \
            --x86-64-record "$RUNNER_TEMP/hormuz-macos-x86-64-records/clean-machine.json" \
            --lifecycle "$RUNNER_TEMP/hormuz-macos-arm64-records/lifecycle.json" \
            --codex-record "$RUNNER_TEMP/hormuz-macos-arm64-records/codex-recovery.json" \
            --claude-record "$RUNNER_TEMP/hormuz-macos-arm64-records/claude-recovery.json" \
            --source-commit "$GITHUB_SHA" \
            --workflow-run-url "$HORMUZ_WORKFLOW_RUN_URL" \
            --output "$HORMUZ_OUTPUT/macos-pilot-operations-evidence.json"
          test "$(find "$HORMUZ_OUTPUT" -type f | wc -l | tr -d ' ')" = 1
      - name: Upload exact operations evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-macos-pilot-operations-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hormuz-macos-pilot-operations
          if-no-files-found: error
          retention-days: 30
          overwrite: false
