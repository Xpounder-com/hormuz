name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Hormuz in editable mode
        run: python -m pip install --editable .
      - name: Run provider-free five-minute quickstart
        run: hormuz demo
      - name: Verify active-core secret custody inventory
        run: python tools/verify_secret_inventory.py
      - name: Run unit and gateway integration tests
        env:
          TMPDIR: ${{ github.workspace }}/.hormuz-test-tmp
          TEMP: ${{ github.workspace }}/.hormuz-test-tmp
          TMP: ${{ github.workspace }}/.hormuz-test-tmp
        run: |
          mkdir -m 700 "$TMPDIR"
          python -m unittest -v

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify the accepted v1 deployment contract
        run: >-
          python tools/verify_deployment_contract.py
          --output "$RUNNER_TEMP/v1-deployment-contract-summary.json"
      - name: Install pinned build frontend
        run: python -m pip install build==1.3.0
      - name: Verify the typed v1 persistence composition boundary
        run: |
          python -m pip install --require-hashes -r requirements/persistence-typecheck.lock
          python -m mypy --strict --follow-imports=silent --disallow-any-unimported \
            --no-incremental --python-version 3.11 \
            hormuz/store_router.py tests/typing_fixtures/usage_repository.py
      - name: Build core and experimental distributions
        run: |
          python -m build
          python -m build experiments/context
      - name: Prove the isolated core wheel boundary
        run: |
          python tools/verify_core_wheel.py \
            --wheel dist/hormuz-*.whl \
            --sdist dist/hormuz-*.tar.gz \
            --config config.example.json
      - name: Install and exercise the separate experiment wheel
        run: |
          python -m venv "$RUNNER_TEMP/hormuz-wheel"
          "$RUNNER_TEMP/hormuz-wheel/bin/pip" install \
            dist/hormuz-*.whl \
            experiments/context/dist/hormuz_context_experiment-*.whl
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" demo
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" policy demo
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" auth token --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz-context-experiment" --help
          HORMUZ_TOKEN=test-identity-token "$RUNNER_TEMP/hormuz-wheel/bin/hormuz-context-experiment" \
            --config config.example.json \
            context-pack \
            --records experiments/context/examples/context-records.jsonl \
            --query "How should API retries work?" \
            --organization xpounder \
            --actor alice \
            --repository Xpounder-com/hormuz \
            --token-budget 2000 \
            --policy-version engineering-v1 \
            > "$RUNNER_TEMP/context-pack.json"
          CONTEXT_PACK_PATH="$RUNNER_TEMP/context-pack.json" "$RUNNER_TEMP/hormuz-wheel/bin/python" -c 'import json, os, pathlib; value = json.loads(pathlib.Path(os.environ["CONTEXT_PACK_PATH"]).read_text()); assert value["schema_version"] == "hormuz.context-pack.v1"; assert value["items"]'
          "$RUNNER_TEMP/hormuz-wheel/bin/python" -m unittest discover -s experiments/context/tests -v
      - name: Verify finance values and SQLite finance/budget runtime from the installed core wheel
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/hormuz-wheel/bin/python" -I -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" -p test_finance_values.py -v
          "$RUNNER_TEMP/hormuz-wheel/bin/python" -I -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" -p test_finance_usage.py -v
          "$RUNNER_TEMP/hormuz-wheel/bin/python" -I -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" -p test_finance_rate_cards.py -v
          "$RUNNER_TEMP/hormuz-wheel/bin/python" -I -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" -p test_sqlite_finance.py -v
          "$RUNNER_TEMP/hormuz-wheel/bin/python" -I -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" -p test_budget_schema.py -v
          "$RUNNER_TEMP/hormuz-wheel/bin/python" -I -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" -p test_sqlite_budget.py -v
      - name: Verify additive portfolio, budget, and finance preflights from the source distribution
        run: |
          hormuz_extension_source="$(mktemp -d "$RUNNER_TEMP/hormuz-extensions.XXXXXX")"
          hormuz_extension_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tar -xzf dist/hormuz-*.tar.gz -C "$hormuz_extension_source"
          cd "$hormuz_extension_source/hormuz-$hormuz_extension_version"
          "$RUNNER_TEMP/hormuz-wheel/bin/python" -I tools/verify_portfolio_extensions.py
          "$RUNNER_TEMP/hormuz-wheel/bin/python" -I tools/verify_budget_transition_plan.py
          "$RUNNER_TEMP/hormuz-wheel/bin/python" -I tools/verify_finance_native_attempt_transition_plan.py
          "$RUNNER_TEMP/hormuz-wheel/bin/python" -m unittest -v \
            tests.test_portfolio_extensions tests.test_portfolio_extension_packaging \
            tests.test_budget_transition_plan tests.test_budget_preflight_packaging \
            tests.test_finance_native_attempt_transition_plan tests.test_finance_native_attempt_packaging \
            tests.test_portfolio_wire_contract
      - name: Verify the resolved license boundary for every declared extra
        run: |
          python -m venv "$RUNNER_TEMP/hormuz-license"
          core_wheel="$(printf '%s\n' dist/hormuz-*.whl)"
          "$RUNNER_TEMP/hormuz-license/bin/pip" install \
            "${core_wheel}[postgres,aws,self-hosted]" \
            experiments/context/dist/hormuz_context_experiment-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/hormuz-license/bin/python" \
            "$GITHUB_WORKSPACE/tools/verify_dependency_licenses.py" \
            --output "$RUNNER_TEMP/dependency-license-summary.json"
      - name: Validate the content-free public disclosure report
        run: |
          python tools/verify_public_disclosure_report.py \
            --report docs/evidence/public-disclosure-report-v1.json \
            --require-verdict public_transition_verified
      - name: Preserve distribution evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-distributions
          path: |
            dist/*
            experiments/context/dist/*
            ${{ runner.temp }}/dependency-license-summary.json
            ${{ runner.temp }}/v1-deployment-contract-summary.json
          if-no-files-found: error
          retention-days: 7

  postgres-compatibility:
    name: PostgreSQL compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: hormuz_test
          POSTGRES_PASSWORD: hormuz-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hormuz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch and verify the immutable released v1 baseline
        run: |
          python -m pip install --editable .
          baseline_url="https://github.com/Xpounder-com/hormuz/releases/download/candidate-v1.0.0-2c3b16c1742ee76032a33f3714492a8d8515c5291d4d57520441882cd8bc5b5a"
          curl --fail --location --retry 3 "$baseline_url/hormuz-1.0.0.tar.gz" \
            --output "$RUNNER_TEMP/hormuz-1.0.0.tar.gz"
          curl --fail --location --retry 3 "$baseline_url/hormuz-v1.0.0-candidate-manifest.json" \
            --output "$RUNNER_TEMP/hormuz-v1.0.0-candidate-manifest.json"
          python tools/verify_registry_transition_plan.py \
            --baseline-archive "$RUNNER_TEMP/hormuz-1.0.0.tar.gz" \
            --baseline-manifest "$RUNNER_TEMP/hormuz-v1.0.0-candidate-manifest.json"
          python tools/verify_attribution_transition_plan.py \
            --baseline-archive "$RUNNER_TEMP/hormuz-1.0.0.tar.gz" \
            --baseline-manifest "$RUNNER_TEMP/hormuz-v1.0.0-candidate-manifest.json"
          python -m venv "$RUNNER_TEMP/hormuz-v1-baseline"
          "$RUNNER_TEMP/hormuz-v1-baseline/bin/python" -m pip install \
            "$RUNNER_TEMP/hormuz-1.0.0.tar.gz[postgres]"
      - name: Verify and install the real registry predecessor
        run: |
          git fetch --no-tags origin b8cec8faba8d8e48d515dfcc3ec8eeaa78fc7926
          git -c tar.umask=0000 archive --format=tar --prefix=hormuz-registry-baseline/ \
            --output="$RUNNER_TEMP/registry-baseline-b8cec8f.tar" \
            b8cec8faba8d8e48d515dfcc3ec8eeaa78fc7926
          python tools/verify_attribution_transition_plan.py \
            --baseline-archive "$RUNNER_TEMP/hormuz-1.0.0.tar.gz" \
            --baseline-manifest "$RUNNER_TEMP/hormuz-v1.0.0-candidate-manifest.json" \
            --registry-archive "$RUNNER_TEMP/registry-baseline-b8cec8f.tar"
          python -m venv "$RUNNER_TEMP/hormuz-registry-baseline"
          "$RUNNER_TEMP/hormuz-registry-baseline/bin/python" -m pip install \
            "$RUNNER_TEMP/registry-baseline-b8cec8f.tar[postgres]"
      - name: Verify and install the real attribution predecessor
        run: |
          git fetch --no-tags origin ade456b90a3f065ebee5b51893dbf111e815ff05
          git -c tar.umask=0000 archive --format=tar --prefix=hormuz-attribution-baseline/ \
            --output="$RUNNER_TEMP/attribution-baseline-ade456b.tar" \
            ade456b90a3f065ebee5b51893dbf111e815ff05
          python tools/verify_outcome_transition_plan.py \
            --baseline-archive "$RUNNER_TEMP/hormuz-1.0.0.tar.gz" \
            --baseline-manifest "$RUNNER_TEMP/hormuz-v1.0.0-candidate-manifest.json" \
            --attribution-archive "$RUNNER_TEMP/attribution-baseline-ade456b.tar"
          python -m venv "$RUNNER_TEMP/hormuz-attribution-baseline"
          "$RUNNER_TEMP/hormuz-attribution-baseline/bin/python" -m pip install \
            "$RUNNER_TEMP/attribution-baseline-ade456b.tar[postgres]"
      - name: Verify and install the real outcome predecessor
        run: |
          git fetch --no-tags origin aa648edf64df9f4a0c426ad73a95852f11561099
          git -c tar.umask=0000 archive --format=tar --prefix=hormuz-outcome-baseline/ \
            --output="$RUNNER_TEMP/outcome-baseline-aa648ed.tar" \
            aa648edf64df9f4a0c426ad73a95852f11561099
          python tools/verify_finance_transition_plan.py \
            --baseline-archive "$RUNNER_TEMP/hormuz-1.0.0.tar.gz" \
            --baseline-manifest "$RUNNER_TEMP/hormuz-v1.0.0-candidate-manifest.json" \
            --outcome-archive "$RUNNER_TEMP/outcome-baseline-aa648ed.tar"
          python -m venv "$RUNNER_TEMP/hormuz-outcome-baseline"
          "$RUNNER_TEMP/hormuz-outcome-baseline/bin/python" -m pip install \
            "$RUNNER_TEMP/outcome-baseline-aa648ed.tar[postgres]"
      - name: Verify and install the real finance predecessor
        run: |
          git fetch --no-tags origin 1dd6c9f561ee70880d6e68b7aa2d2ab17852d207
          git -c tar.umask=0000 archive --format=tar --prefix=hormuz-finance-baseline/ \
            --output="$RUNNER_TEMP/finance-baseline-1dd6c9f.tar" \
            1dd6c9f561ee70880d6e68b7aa2d2ab17852d207
          python tools/verify_budget_transition_plan.py \
            --finance-archive "$RUNNER_TEMP/finance-baseline-1dd6c9f.tar"
          python -m venv "$RUNNER_TEMP/hormuz-finance-baseline"
          "$RUNNER_TEMP/hormuz-finance-baseline/bin/python" -m pip install \
            "$RUNNER_TEMP/finance-baseline-1dd6c9f.tar[postgres]"
      - name: Verify and install the accepted budget-runtime predecessor
        run: |
          git fetch --no-tags origin 4e3133f19db4c34d7a181848ebc36754bce164ea
          git -c tar.umask=0000 archive --format=tar --prefix=hormuz-budget-runtime-baseline/ \
            --output="$RUNNER_TEMP/budget-runtime-baseline-4e3133f.tar" \
            4e3133f19db4c34d7a181848ebc36754bce164ea
          python tools/verify_finance_native_attempt_transition_plan.py \
            --predecessor-archive "$RUNNER_TEMP/budget-runtime-baseline-4e3133f.tar"
          python -m venv "$RUNNER_TEMP/hormuz-budget-runtime-baseline"
          "$RUNNER_TEMP/hormuz-budget-runtime-baseline/bin/python" -m pip install \
            "$RUNNER_TEMP/budget-runtime-baseline-4e3133f.tar[postgres]"
      - name: Build the candidate wheel
        run: |
          python -m pip install build==1.3.0
          python -m build
      - name: Install the wheel and PostgreSQL adapter in isolation
        run: |
          python -m venv "$RUNNER_TEMP/hormuz-postgres-wheel"
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/pip" install \
            dist/hormuz-*.whl \
            'psycopg[binary]>=3.3.4,<3.4' \
            'psycopg-pool>=3.3.1,<3.4'
      - name: Exercise the transition kit from the unpacked source archive
        run: |
          mkdir "$RUNNER_TEMP/registry-preflight-source"
          tar -xzf dist/hormuz-*.tar.gz -C "$RUNNER_TEMP/registry-preflight-source"
          cd "$RUNNER_TEMP/registry-preflight-source"/hormuz-*
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" tools/verify_registry_transition_plan.py
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" tools/verify_attribution_transition_plan.py
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" tools/verify_outcome_transition_plan.py
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" tools/verify_finance_transition_plan.py
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" tools/verify_budget_transition_plan.py
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" tools/verify_finance_native_attempt_transition_plan.py
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest -v \
            tests.test_registry_transition_plan tests.test_attribution_transition_plan tests.test_outcome_transition_plan \
            tests.test_finance_transition_plan tests.test_finance_packaging \
            tests.test_budget_transition_plan tests.test_budget_preflight_packaging \
            tests.test_finance_native_attempt_transition_plan tests.test_finance_native_attempt_packaging \
            tests.test_portfolio_wire_contract
      - name: Prove PostgreSQL migration and repository compatibility
        env:
          HORMUZ_TEST_POSTGRES_DSN: postgresql://postgres:hormuz-test-password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/hormuz_test
          HORMUZ_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
          HORMUZ_TEST_V1_PYTHON: ${{ runner.temp }}/hormuz-v1-baseline/bin/python
          HORMUZ_TEST_REGISTRY_PYTHON: ${{ runner.temp }}/hormuz-registry-baseline/bin/python
          HORMUZ_TEST_ATTRIBUTION_PYTHON: ${{ runner.temp }}/hormuz-attribution-baseline/bin/python
          HORMUZ_TEST_OUTCOME_PYTHON: ${{ runner.temp }}/hormuz-outcome-baseline/bin/python
          HORMUZ_TEST_FINANCE_PYTHON: ${{ runner.temp }}/hormuz-finance-baseline/bin/python
          HORMUZ_TEST_FINANCE_NATIVE_PYTHON: ${{ runner.temp }}/hormuz-budget-runtime-baseline/bin/python
        run: |
          test -x "$HORMUZ_TEST_V1_PYTHON"
          test -x "$HORMUZ_TEST_REGISTRY_PYTHON"
          test -x "$HORMUZ_TEST_ATTRIBUTION_PYTHON"
          test -x "$HORMUZ_TEST_OUTCOME_PYTHON"
          test -x "$HORMUZ_TEST_FINANCE_PYTHON"
          test -x "$HORMUZ_TEST_FINANCE_NATIVE_PYTHON"
          test -n "$HORMUZ_TEST_PG_CONTAINER"
          test -n "$HORMUZ_TEST_POSTGRES_DSN"
          cd "$RUNNER_TEMP"
          for module in test_sqlite_finance test_postgres_finance; do
            "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -I -m unittest discover \
              -s "$GITHUB_WORKSPACE/tests" -p "${module}.py" -v
          done
          for module in test_sqlite_budget test_postgres_budget; do
            "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -I -m unittest discover \
              -s "$GITHUB_WORKSPACE/tests" -p "${module}.py" -v
          done
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -I -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" -p test_sqlite_finance_transition.py -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -I -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" -p test_postgres_finance_transition.py -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -I -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" -p test_sqlite_budget_transition.py -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -I -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" -p test_postgres_budget_transition.py -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -I -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" -p test_sqlite_finance_native_attempt_transition.py -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -I -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" -p test_postgres_finance_native_attempt_transition.py -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" -p test_sqlite_outcome_transition.py -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" -p test_postgres_outcome_transition.py -v
          for module in test_outcome_contract test_outcome_ingest test_outcome_schema test_sqlite_outcomes test_postgres_outcomes; do
            "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
              -s "$GITHUB_WORKSPACE/tests" -p "${module}.py" -v
          done
          for module in test_attribution_admission test_attribution_schema test_sqlite_attribution test_attribution_gateway test_postgres_attribution test_postgres_attribution_gateway; do
            "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
              -s "$GITHUB_WORKSPACE/tests" -p "${module}.py" -v
          done
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_sqlite_registry_transition.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_sqlite_attribution_transition.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_sqlite_portfolio_registry.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_portfolio_api_cli.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_portfolio_registry.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_registry_transition.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_attribution_transition.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_test_boundaries.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_migration_rls.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_policy_control.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_custody_control.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_custody_executor.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_custody_lifecycle.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_usage.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_audit_chain.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_request_attempts.py \
            -v
