name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PIP_RETRIES: '3'
  PIP_TIMEOUT: '30'

jobs:
  workflow:
    name: Router workflow (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python tools/verify_router_scope.py
      - run: python -m unittest tests.test_execution_destination_workflow tests.test_connected_client_lifetime_workflow -f -q

  package:
    name: Router installed wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.3.0
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python tools/verify_router_wheel.py dist/*.whl
      - name: Preserve verified router distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-router-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  required:
    name: CI / required
    if: ${{ always() }}
    needs: [workflow, package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every workflow and package check
        env:
          WORKFLOW_RESULT: ${{ needs.workflow.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$WORKFLOW_RESULT" = success
          test "$PACKAGE_RESULT" = success
