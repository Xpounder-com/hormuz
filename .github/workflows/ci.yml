name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Hormuz in editable mode
        run: python -m pip install --editable .
      - name: Verify active-core secret custody inventory
        run: python tools/verify_secret_inventory.py
      - name: Run unit and gateway integration tests
        run: python -m unittest -v

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned build frontend
        run: python -m pip install build==1.3.0
      - name: Build core and experimental distributions
        run: |
          python -m build
          python -m build experiments/context
      - name: Prove the isolated core wheel boundary
        run: |
          python tools/verify_core_wheel.py \
            --wheel dist/hormuz-*.whl \
            --sdist dist/hormuz-*.tar.gz \
            --config config.example.json
      - name: Install and exercise the separate experiment wheel
        run: |
          python -m venv "$RUNNER_TEMP/hormuz-wheel"
          "$RUNNER_TEMP/hormuz-wheel/bin/pip" install \
            dist/hormuz-*.whl \
            experiments/context/dist/hormuz_context_experiment-*.whl
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" auth token --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz-context-experiment" --help
          HORMUZ_TOKEN=test-identity-token "$RUNNER_TEMP/hormuz-wheel/bin/hormuz-context-experiment" \
            --config config.example.json \
            context-pack \
            --records experiments/context/examples/context-records.jsonl \
            --query "How should API retries work?" \
            --organization xpounder \
            --actor alice \
            --repository Xpounder-com/hormuz \
            --token-budget 2000 \
            --policy-version engineering-v1 \
            > "$RUNNER_TEMP/context-pack.json"
          CONTEXT_PACK_PATH="$RUNNER_TEMP/context-pack.json" "$RUNNER_TEMP/hormuz-wheel/bin/python" -c 'import json, os, pathlib; value = json.loads(pathlib.Path(os.environ["CONTEXT_PACK_PATH"]).read_text()); assert value["schema_version"] == "hormuz.context-pack.v1"; assert value["items"]'
          "$RUNNER_TEMP/hormuz-wheel/bin/python" -m unittest discover -s experiments/context/tests -v
      - name: Preserve distribution evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-distributions
          path: |
            dist/*
            experiments/context/dist/*
          if-no-files-found: error
          retention-days: 7

  postgres-compatibility:
    name: PostgreSQL compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: hormuz_test
          POSTGRES_PASSWORD: hormuz-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hormuz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the candidate wheel
        run: |
          python -m pip install build==1.3.0
          python -m build
      - name: Install the wheel and PostgreSQL adapter in isolation
        run: |
          python -m venv "$RUNNER_TEMP/hormuz-postgres-wheel"
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/pip" install \
            dist/hormuz-*.whl \
            'psycopg[binary]>=3.3.4,<3.4' \
            'psycopg-pool>=3.3.1,<3.4'
      - name: Prove PostgreSQL migration and repository compatibility
        env:
          HORMUZ_TEST_POSTGRES_DSN: postgresql://postgres:hormuz-test-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/hormuz_test
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_test_boundaries.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_migration_rls.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_policy_control.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_custody_control.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_usage.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_audit_chain.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_request_attempts.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_multi_instance.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_runtime_recovery.py \
            -v
          "$RUNNER_TEMP/hormuz-postgres-wheel/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -p test_postgres_pooling.py \
            -v

  postgres-backup-restore:
    name: PostgreSQL recovery drills
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the candidate wheel
        run: |
          python -m pip install build==1.3.0
          python -m build
      - name: Install the candidate and PostgreSQL adapter in isolation
        run: |
          python -m venv "$RUNNER_TEMP/hormuz-postgres-recovery"
          "$RUNNER_TEMP/hormuz-postgres-recovery/bin/pip" install \
            dist/hormuz-*.whl \
            'psycopg[binary]>=3.3.4,<3.4' \
            'psycopg-pool>=3.3.1,<3.4'
      - name: Exercise disposable logical backup and restore
        env:
          HORMUZ_POSTGRES_RECOVERY_PYTHON: ${{ runner.temp }}/hormuz-postgres-recovery/bin/python
          HORMUZ_POSTGRES_RECOVERY_EVIDENCE_DIR: ${{ runner.temp }}/hormuz-postgres-recovery-evidence
        run: ./tools/verify_postgres_backup_restore.sh
      - name: Exercise disposable interruption and pool recovery
        env:
          HORMUZ_POSTGRES_INTERRUPTION_PYTHON: ${{ runner.temp }}/hormuz-postgres-recovery/bin/python
          HORMUZ_POSTGRES_INTERRUPTION_EVIDENCE_DIR: ${{ runner.temp }}/hormuz-postgres-interruption-evidence
        run: ./tools/verify_postgres_interruption_recovery.sh
      - name: Exercise disposable point-in-time recovery
        env:
          HORMUZ_POSTGRES_PITR_ACKNOWLEDGEMENT: I_UNDERSTAND_DISPOSABLE_POSTGRESQL_PITR
          HORMUZ_POSTGRES_PITR_PYTHON: ${{ runner.temp }}/hormuz-postgres-recovery/bin/python
          HORMUZ_POSTGRES_PITR_EVIDENCE_DIR: ${{ runner.temp }}/hormuz-postgres-pitr-evidence
        run: ./tools/verify_postgres_pitr_recovery.sh
      - name: Preserve PostgreSQL recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-postgres-recovery
          path: |
            ${{ runner.temp }}/hormuz-postgres-recovery-evidence/summary.json
            ${{ runner.temp }}/hormuz-postgres-interruption-evidence/summary.json
            ${{ runner.temp }}/hormuz-postgres-pitr-evidence/summary.json
          if-no-files-found: warn
          retention-days: 7

  oci-reference-runtime:
    name: OCI reference runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and smoke-test the non-root OCI reference runtime
        run: ./tools/verify_oci_reference.sh

  oci-supply-chain:
    name: OCI supply-chain evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build candidate and enforce the fix-aware vulnerability policy
        env:
          HORMUZ_OCI_SUPPLY_CHAIN_EVIDENCE_DIR: ${{ runner.temp }}/hormuz-oci-supply-chain
        run: ./tools/verify_oci_supply_chain.sh
      - name: Preserve OCI supply-chain evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-oci-supply-chain
          path: ${{ runner.temp }}/hormuz-oci-supply-chain/*
          if-no-files-found: warn
          retention-days: 7

  client-compatibility:
    name: Codex and Claude Code compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEX_VERSION: "0.147.0"
      CLAUDE_CODE_VERSION: "2.1.233"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Hormuz runtime
        run: python -m pip install --editable .
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install pinned official clients
        run: |
          npm install --prefix "$RUNNER_TEMP/hormuz-clients" --no-package-lock --no-save \
            "@openai/codex@$CODEX_VERSION" \
            "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          echo "$RUNNER_TEMP/hormuz-clients/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Record client versions
        run: |
          codex --version
          claude --version
      - name: Verify both clients through Hormuz
        env:
          HORMUZ_RUN_CLAUDE_CLIENT_TEST: "1"
        run: |
          python -m unittest -v \
            tests.test_gateway.GatewayIntegrationTests.test_installed_codex_routes_through_gateway \
            tests.test_gateway.GatewayIntegrationTests.test_official_claude_code_routes_through_gateway
