name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PIP_RETRIES: '3'
  PIP_TIMEOUT: '30'

jobs:
  workflow:
    name: Router workflow (Python ${{ matrix.python }})
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 27
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Download the shared router distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: koto-router-distributions
          path: dist/
      - run: python -m pip install dist/*.whl
      - name: Test the installed wheel and profile slow workflows
        run: python tools/verify_router_wheel.py dist/*.whl

  package:
    name: Build router distributions
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.3.0
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python tools/verify_router_scope.py
      - name: Preserve the shared router distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: koto-router-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  required:
    name: CI / required
    if: ${{ always() }}
    needs: [workflow, package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every workflow and package check
        env:
          WORKFLOW_RESULT: ${{ needs.workflow.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$WORKFLOW_RESULT" = success
          test "$PACKAGE_RESULT" = success
