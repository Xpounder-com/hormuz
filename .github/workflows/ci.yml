name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hash-locked build toolchain
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --requirement deploy/build/requirements.lock
      - name: Install hash-locked runtime dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --requirement deploy/container/requirements.lock
      - name: Install Hormuz in editable mode
        run: python -m pip install --no-build-isolation --no-deps --editable .
      - name: Verify runtime dependency closure
        run: python -m pip check
      - name: Run unit and gateway integration tests
        run: python -m unittest -v

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install hash-locked build toolchain
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --requirement deploy/build/requirements.lock
      - name: Build and compare independent exact-source distributions
        run: |
          python scripts/reproducible_build.py \
            --source-sha "$GITHUB_SHA" \
            --outdir dist
      - name: Install and run the wheel
        run: |
          python -m venv "$RUNNER_TEMP/hormuz-wheel"
          "$RUNNER_TEMP/hormuz-wheel/bin/pip" install --require-hashes --only-binary=:all: \
            --requirement deploy/container/requirements.lock
          "$RUNNER_TEMP/hormuz-wheel/bin/pip" install --no-deps dist/hormuz-*.whl
          "$RUNNER_TEMP/hormuz-wheel/bin/pip" check
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" context-pack --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" context-import --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" context-snapshot-import --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" context-snapshot-show --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" context-evidence-import --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" context-revalidate --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" lifecycle evidence --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" lifecycle snapshot --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" lifecycle revalidate --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" context-list --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" context-export --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" context-audit-export --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" audit-export --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" audit-verify --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" billing import --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" billing fetch --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" billing reconcile --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" sessions list --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" sessions events --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" sessions revoke --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" mcp --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" mcp-config --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" context-benchmark --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" auth token --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" dlp evaluate --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" dlp approval show --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" dlp approval approve --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" login --help
          "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" logout --help
          HORMUZ_TOKEN="ci-synthetic-identity-token-0001" \
            "$RUNNER_TEMP/hormuz-wheel/bin/hormuz" \
            --config config.example.json \
            dlp evaluate \
            --rule-id email_address \
            --corpus-id ci-package-email-v1 \
            --protocol openai \
            --model gpt-5.4-mini \
            --input examples/dlp-evaluation-email.jsonl \
            --output "$RUNNER_TEMP/dlp-evaluation-package.json"
      - name: Validate versioned threat model
        run: >-
          python scripts/threat_model_contract.py
          --model security/threat-model.json
          --project-root .
          --output "$RUNNER_TEMP/hormuz-threat-model-evidence.json"
      - name: Validate versioned compatibility matrix
        run: >-
          python scripts/compatibility_contract.py
          --matrix compatibility/compatibility-matrix.json
          --project-root .
          --output "$RUNNER_TEMP/hormuz-compatibility-evidence.json"
      - name: Preserve threat-model evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-threat-model
          path: ${{ runner.temp }}/hormuz-threat-model-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve compatibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-compatibility
          path: ${{ runner.temp }}/hormuz-compatibility-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve distribution evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  context-benchmark:
    name: Governed context benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install hash-locked build toolchain
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --requirement deploy/build/requirements.lock
      - name: Install hash-locked runtime dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --requirement deploy/container/requirements.lock
      - name: Install Hormuz in editable mode
        run: python -m pip install --no-build-isolation --no-deps --editable .
      - name: Verify runtime dependency closure
        run: python -m pip check
      - name: Verify frozen benchmark artifacts
        run: python benchmarks/context/generate_corpus.py --check
      - name: Run strict lifecycle release profile
        run: |
          hormuz context-benchmark \
            --profile release \
            --iterations 5 \
            --output "$RUNNER_TEMP/context-benchmark-release.json"
      - name: Preserve benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-context-benchmark
          path: ${{ runner.temp }}/context-benchmark-release.json
          if-no-files-found: error
          retention-days: 7

  client-compatibility:
    name: Codex and Claude Code compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install hash-locked build toolchain
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --requirement deploy/build/requirements.lock
      - name: Install hash-locked runtime dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --requirement deploy/container/requirements.lock
      - name: Install Hormuz runtime
        run: python -m pip install --no-build-isolation --no-deps --editable .
      - name: Verify runtime dependency closure
        run: python -m pip check
      - name: Validate pinned official-client closure
        run: >-
          python scripts/client_lock_contract.py
          --output "$RUNNER_TEMP/hormuz-client-lock-contract.json"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: deploy/clients/package-lock.json
      - name: Verify exact client toolchain
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
      - name: Install integrity-locked official clients
        run: |
          npm ci --prefix deploy/clients --ignore-scripts --no-audit --no-fund
          node deploy/clients/node_modules/@anthropic-ai/claude-code/install.cjs
          echo "$GITHUB_WORKSPACE/deploy/clients/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Record client versions
        run: |
          node --version
          npm --version
          codex --version
          claude --version
      - name: Verify both clients through Hormuz
        env:
          HORMUZ_RUN_CLAUDE_CLIENT_TEST: "1"
        run: |
          python -m unittest -v \
            tests.test_gateway.GatewayIntegrationTests.test_installed_codex_routes_through_gateway \
            tests.test_gateway.GatewayIntegrationTests.test_official_claude_code_routes_through_gateway
      - name: Preserve pinned-client lock evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-pinned-client-lock
          path: ${{ runner.temp }}/hormuz-client-lock-contract.json
          if-no-files-found: error
          retention-days: 7

  container:
    name: Restricted container, SBOM, and vulnerability gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HORMUZ_IMAGE: hormuz:ci-${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Build and compare independent exact-source amd64 OCI layouts
        run: |
          python scripts/reproducible_image.py \
            --source-sha "$GITHUB_SHA" \
            --platform linux/amd64 \
            --outdir "$RUNNER_TEMP/hormuz-reproducible-oci/linux-amd64"
      - name: Build and compare independent exact-source arm64 OCI layouts
        run: |
          python scripts/reproducible_image.py \
            --source-sha "$GITHUB_SHA" \
            --platform linux/arm64 \
            --outdir "$RUNNER_TEMP/hormuz-reproducible-oci/linux-arm64"
      - name: Preserve OCI reproducibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-reproducible-oci
          path: ${{ runner.temp }}/hormuz-reproducible-oci/
          if-no-files-found: error
          retention-days: 7
      - name: Build pinned Hormuz image
        run: |
          HORMUZ_SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          docker build \
            --pull=false \
            --build-arg "HORMUZ_REVISION=$GITHUB_SHA" \
            --build-arg "SOURCE_DATE_EPOCH=$HORMUZ_SOURCE_DATE_EPOCH" \
            --tag "$HORMUZ_IMAGE" \
            .
      - name: Verify restricted runtime and graceful shutdown
        run: python3 scripts/container_smoke.py --image "$HORMUZ_IMAGE"
      - name: Generate CycloneDX software bill of materials
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ${{ env.HORMUZ_IMAGE }}
          scanners: vuln
          format: cyclonedx
          output: ${{ runner.temp }}/hormuz.sbom.cdx.json
          exit-code: "0"
      - name: Record and enforce vulnerability result
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output "$RUNNER_TEMP/hormuz-vulnerability-report.json" \
            "$HORMUZ_IMAGE"
      - name: Record image metadata
        if: always()
        run: docker image inspect "$HORMUZ_IMAGE" > "$RUNNER_TEMP/hormuz-image-inspect.json"
      - name: Preserve container security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-container-security
          path: |
            ${{ runner.temp }}/hormuz.sbom.cdx.json
            ${{ runner.temp }}/hormuz-vulnerability-report.json
            ${{ runner.temp }}/hormuz-image-inspect.json
          if-no-files-found: error
          retention-days: 7
