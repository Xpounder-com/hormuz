name: Mac signed distribution

on:
  workflow_dispatch:
    inputs:
      version:
        description: Three-component marketing version
        required: true
        default: 1.2.0
        type: string

permissions:
  contents: read

concurrency:
  group: macos-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  context-helper:
    name: Build signed context helper (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: macos-distribution
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require reviewed default-branch source
        env:
          HORMUZ_EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "$HORMUZ_EXPECTED_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned helper build dependencies
        run: python -m pip install --disable-pip-version-check '.[context-build]'
      - name: Build the native helper with its embedded code signed
        env:
          HORMUZ_CONTEXT_ARCH: ${{ matrix.architecture }}
          HORMUZ_CONTEXT_SKIP_RUNTIME_CHECK: "1"
          HORMUZ_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          HORMUZ_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          HORMUZ_TEAM_ID: R267LZMUTY
        run: |
          set -euo pipefail
          umask 077
          test -n "$HORMUZ_CERTIFICATE_BASE64"
          test -n "$HORMUZ_CERTIFICATE_PASSWORD"
          HORMUZ_CONTEXT_KEYCHAIN="$RUNNER_TEMP/hormuz-context-signing.keychain-db"
          HORMUZ_CONTEXT_CERTIFICATE="$RUNNER_TEMP/hormuz-context-developer-id.p12"
          export HORMUZ_CONTEXT_CERTIFICATE
          HORMUZ_CONTEXT_KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          cleanup() {
            security delete-keychain "$HORMUZ_CONTEXT_KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$HORMUZ_CONTEXT_CERTIFICATE"
          }
          trap cleanup EXIT
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["HORMUZ_CONTEXT_CERTIFICATE"]).write_bytes(
              base64.b64decode(os.environ["HORMUZ_CERTIFICATE_BASE64"], validate=True)
          )
          PY
          security create-keychain -p "$HORMUZ_CONTEXT_KEYCHAIN_PASSWORD" "$HORMUZ_CONTEXT_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$HORMUZ_CONTEXT_KEYCHAIN"
          security unlock-keychain -p "$HORMUZ_CONTEXT_KEYCHAIN_PASSWORD" "$HORMUZ_CONTEXT_KEYCHAIN"
          security import "$HORMUZ_CONTEXT_CERTIFICATE" -k "$HORMUZ_CONTEXT_KEYCHAIN" \
            -P "$HORMUZ_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$HORMUZ_CONTEXT_KEYCHAIN_PASSWORD" "$HORMUZ_CONTEXT_KEYCHAIN"
          security list-keychains -d user -s "$HORMUZ_CONTEXT_KEYCHAIN"
          security default-keychain -d user -s "$HORMUZ_CONTEXT_KEYCHAIN"
          HORMUZ_CONTEXT_IDENTITIES="$(security find-identity -v -p codesigning \
            "$HORMUZ_CONTEXT_KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: [^"]*\)"/\1/p')"
          test "$(printf '%s\n' "$HORMUZ_CONTEXT_IDENTITIES" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          HORMUZ_CONTEXT_IDENTITY="$HORMUZ_CONTEXT_IDENTITIES"
          [[ "$HORMUZ_CONTEXT_IDENTITY" == *"($HORMUZ_TEAM_ID)" ]]
          rm -f "$HORMUZ_CONTEXT_CERTIFICATE"
          unset HORMUZ_CERTIFICATE_BASE64 HORMUZ_CERTIFICATE_PASSWORD
          ./tools/build_context_helper.sh "$(command -v python)" \
            "$RUNNER_TEMP/context-helper-build" "$HORMUZ_CONTEXT_ARCH" \
            "$HORMUZ_CONTEXT_IDENTITY" com.xpounder.hormuz
          mkdir "$RUNNER_TEMP/context-helper-artifact"
          cp "$RUNNER_TEMP/context-helper-build/dist/hormuz-context" \
            "$RUNNER_TEMP/context-helper-artifact/hormuz-context-$HORMUZ_CONTEXT_ARCH"
      - name: Verify and execute the signed helper without credentials
        env:
          HORMUZ_CONTEXT_ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          HORMUZ_CONTEXT_HELPER="$RUNNER_TEMP/context-helper-artifact/hormuz-context-$HORMUZ_CONTEXT_ARCH"
          codesign --verify --strict --verbose=4 "$HORMUZ_CONTEXT_HELPER"
          "$HORMUZ_CONTEXT_HELPER" context --help >/dev/null
      - name: Set up Node.js for packaged-client conformance
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Prove actual Codex compaction through the packaged helper
        env:
          HORMUZ_CONTEXT_ARCH: ${{ matrix.architecture }}
          HORMUZ_RUN_CONTEXT_CLIENT_TEST: "1"
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/hormuz-context-client" \
            --no-package-lock --no-save '@openai/codex@0.147.0'
          python -m hormuz context resources install \
            --directory "$RUNNER_TEMP/context-tokenizers"
          PATH="$RUNNER_TEMP/hormuz-context-client/node_modules/.bin:$PATH" \
            HORMUZ_CONTEXT_TOKENIZER_CACHE="$RUNNER_TEMP/context-tokenizers" \
            HORMUZ_PACKAGED_CONTEXT_HELPER="$RUNNER_TEMP/context-helper-artifact/hormuz-context-$HORMUZ_CONTEXT_ARCH" \
            python -m unittest -v \
              tests.test_client_relay.RelayTests.test_official_codex_exec_command_output_is_compacted_through_relay
      - name: Transfer architecture-bound signed helper
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-context-helper-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/context-helper-artifact/hormuz-context-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 1

  build-and-test:
    name: Build and test unsigned client
    needs: context-helper
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require reviewed default-branch source
        env:
          HORMUZ_EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "$HORMUZ_EXPECTED_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Derive immutable release identity
        id: release
        env:
          HORMUZ_INPUT_VERSION: ${{ inputs.version }}
          HORMUZ_BUNDLE_ID: com.xpounder.hormuz
        run: |
          set -euo pipefail
          [[ "$HORMUZ_INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          HORMUZ_PACKAGE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$HORMUZ_INPUT_VERSION" = "$HORMUZ_PACKAGE_VERSION"
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_RUN_ATTEMPT" -lt 1000
          HORMUZ_BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))
          printf 'version=%s\nbuild_number=%s\nbundle_identifier=%s\n' \
            "$HORMUZ_INPUT_VERSION" "$HORMUZ_BUILD_NUMBER" "$HORMUZ_BUNDLE_ID" \
            >> "$GITHUB_OUTPUT"
      - name: Record native toolchain
        run: |
          test "$(uname -m)" = arm64
          swift --version
          xcodebuild -version
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download the standalone Apple Silicon helper
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hormuz-context-helper-*-${{ github.sha }}
          path: ${{ runner.temp }}/hormuz-context-helpers
          merge-multiple: true
      - name: Install verified tokenizer resources
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check '.[context]'
          python -m hormuz context resources install \
            --directory "$RUNNER_TEMP/hormuz-context-tokenizers"
      - name: Test native client without signing credentials
        run: swift test --package-path clients/macos
      - name: Build unsigned Apple Silicon payload
        env:
          HORMUZ_VERSION: ${{ steps.release.outputs.version }}
          HORMUZ_BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
          HORMUZ_BUNDLE_ID: ${{ steps.release.outputs.bundle_identifier }}
        run: |
          set -euo pipefail
          umask 077
          HORMUZ_PAYLOAD="$RUNNER_TEMP/hormuz-unsigned-payload"
          HORMUZ_SCRATCH="$RUNNER_TEMP/hormuz-unsigned-build"
          mkdir "$HORMUZ_PAYLOAD"
          cp -R "$RUNNER_TEMP/hormuz-context-helpers" "$HORMUZ_PAYLOAD/context-helpers"
          cp -R "$RUNNER_TEMP/hormuz-context-tokenizers" "$HORMUZ_PAYLOAD/context-tokenizers"
          for HORMUZ_CONTEXT_SIGNATURE_INPUT in \
            "arm64:$HORMUZ_PAYLOAD/context-helpers/hormuz-context-arm64"; do
            HORMUZ_CONTEXT_SIGNATURE_ARCH="${HORMUZ_CONTEXT_SIGNATURE_INPUT%%:*}"
            HORMUZ_CONTEXT_SIGNATURE_PATH="${HORMUZ_CONTEXT_SIGNATURE_INPUT#*:}"
            codesign --verify --strict --verbose=4 "$HORMUZ_CONTEXT_SIGNATURE_PATH"
            HORMUZ_CONTEXT_SIGNATURE_DETAILS="$(codesign -dvvv "$HORMUZ_CONTEXT_SIGNATURE_PATH" 2>&1)"
            printf '%s\n' "$HORMUZ_CONTEXT_SIGNATURE_DETAILS" | \
              grep -Fqx "Identifier=$HORMUZ_BUNDLE_ID.context-helper.$HORMUZ_CONTEXT_SIGNATURE_ARCH"
            printf '%s\n' "$HORMUZ_CONTEXT_SIGNATURE_DETAILS" | grep -Fqx 'TeamIdentifier=R267LZMUTY'
            printf '%s\n' "$HORMUZ_CONTEXT_SIGNATURE_DETAILS" | grep -Eq '^CodeDirectory .*flags=.*runtime'
            printf '%s\n' "$HORMUZ_CONTEXT_SIGNATURE_DETAILS" | grep -Eq '^Timestamp=.+$'
          done
          swift build --package-path clients/macos --scratch-path "$HORMUZ_SCRATCH" \
            --configuration release --arch arm64 --product Hormuz
          HORMUZ_BINARY_SOURCE="$(swift build --package-path clients/macos \
            --scratch-path "$HORMUZ_SCRATCH" --configuration release \
            --arch arm64 --show-bin-path)/Hormuz"
          cp "$HORMUZ_BINARY_SOURCE" "$HORMUZ_PAYLOAD/Hormuz"
          chmod 755 "$HORMUZ_PAYLOAD/Hormuz"
          HORMUZ_DSYM_SOURCE="$(dirname "$HORMUZ_BINARY_SOURCE")/Hormuz.dSYM"
          if [ -d "$HORMUZ_DSYM_SOURCE" ]; then
            cp -R "$HORMUZ_DSYM_SOURCE" "$HORMUZ_PAYLOAD/Hormuz.dSYM"
          fi
          HORMUZ_REHEARSAL="$RUNNER_TEMP/hormuz-credential-free-rehearsal"
          HORMUZ_REHEARSAL_ARGS=(
            --output-directory "$HORMUZ_REHEARSAL"
            --bundle-id "$HORMUZ_BUNDLE_ID"
            --version "$HORMUZ_VERSION"
            --build "$HORMUZ_BUILD_NUMBER"
            --prebuilt-binary "$HORMUZ_PAYLOAD/Hormuz"
            --context-helper-directory "$HORMUZ_PAYLOAD/context-helpers"
            --tokenizer-cache "$HORMUZ_PAYLOAD/context-tokenizers"
            --ad-hoc
          )
          if [ -d "$HORMUZ_PAYLOAD/Hormuz.dSYM" ]; then
            HORMUZ_REHEARSAL_ARGS+=(--prebuilt-dsym "$HORMUZ_PAYLOAD/Hormuz.dSYM")
          fi
          ./script/package_macos_release.sh "${HORMUZ_REHEARSAL_ARGS[@]}"
          python3 - "$HORMUZ_REHEARSAL/package-metadata.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          proof = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "bundle_identifier": os.environ["HORMUZ_BUNDLE_ID"],
              "version": os.environ["HORMUZ_VERSION"],
              "build": os.environ["HORMUZ_BUILD_NUMBER"],
              "executable_version_verified": True,
              "context_helper_runtime_verified": True,
              "distribution_ready": False,
          }
          if any(proof.get(key) != value for key, value in expected.items()):
              raise SystemExit("credential-free runtime version rehearsal failed")
          PY
          python3 - "$HORMUZ_PAYLOAD" "$HORMUZ_PAYLOAD/payload-manifest.json" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          payload = Path(sys.argv[1])
          manifest = Path(sys.argv[2])
          binary = payload / "Hormuz"
          helpers = {
              "arm64": payload / "context-helpers/hormuz-context-arm64",
          }
          tokenizers = {
              "9b5ad71b2ce5302211f9c61530b329a4922fc6a4": payload / "context-tokenizers/9b5ad71b2ce5302211f9c61530b329a4922fc6a4",
              "fb374d419588a4632f3f557e76b4b70aebbca790": payload / "context-tokenizers/fb374d419588a4632f3f557e76b4b70aebbca790",
          }
          expected_tokenizers = {
              "9b5ad71b2ce5302211f9c61530b329a4922fc6a4": "223921b76ee99bde995b7ff738513eef100fb51d18c93597a113bcffe865b2a7",
              "fb374d419588a4632f3f557e76b4b70aebbca790": "446a9538cb6c348e3516120d7c08b09f57c36495e2acfffe59a5bf8b0cfb1a2d",
          }
          if any(not path.is_file() or path.is_symlink() for path in [binary, *helpers.values(), *tokenizers.values()]):
              raise SystemExit("unsigned payload is incomplete or unsafe")
          architectures = sorted(
              subprocess.check_output(
                  ["lipo", "-archs", str(binary)], text=True
              ).split()
          )
          if architectures != ["arm64"]:
              raise SystemExit("unsigned payload is not exactly Apple Silicon")
          helper_architectures = {
              name: sorted(subprocess.check_output(["lipo", "-archs", str(path)], text=True).split())
              for name, path in helpers.items()
          }
          if helper_architectures != {"arm64": ["arm64"]}:
              raise SystemExit("unsigned helper architectures are wrong")
          tokenizer_digests = {
              name: hashlib.sha256(path.read_bytes()).hexdigest()
              for name, path in tokenizers.items()
          }
          if tokenizer_digests != expected_tokenizers:
              raise SystemExit("unsigned tokenizer resources are wrong")
          manifest.write_text(
              json.dumps(
                  {
                      "schema_id": "hormuz.macos-unsigned-payload",
                      "schema_version": 2,
                      "source_commit": os.environ["GITHUB_SHA"],
                      "bundle_identifier": os.environ["HORMUZ_BUNDLE_ID"],
                      "version": os.environ["HORMUZ_VERSION"],
                      "build": os.environ["HORMUZ_BUILD_NUMBER"],
                      "architectures": architectures,
                      "binary_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
                      "context_helper_architectures": helper_architectures,
                      "context_helper_sha256": {
                          name: hashlib.sha256(path.read_bytes()).hexdigest()
                          for name, path in helpers.items()
                      },
                      "context_tokenizer_sha256": tokenizer_digests,
                      "credential_free_runtime_version_verified": True,
                      "credential_free_context_helper_verified": True,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - name: Transfer only the unsigned payload and digest manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-macos-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/hormuz-unsigned-payload
          if-no-files-found: error
          retention-days: 1

  sign-and-notarize:
    name: Sign, notarize, staple and verify
    needs: build-and-test
    runs-on: macos-15
    timeout-minutes: 45
    environment: macos-distribution
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require reviewed default-branch source
        env:
          HORMUZ_EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          test "$(uname -m)" = arm64
          test "$GITHUB_REF" = "$HORMUZ_EXPECTED_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Derive immutable release identity
        id: release
        env:
          HORMUZ_INPUT_VERSION: ${{ inputs.version }}
          HORMUZ_BUNDLE_ID: com.xpounder.hormuz
        run: |
          set -euo pipefail
          [[ "$HORMUZ_INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          HORMUZ_PACKAGE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$HORMUZ_INPUT_VERSION" = "$HORMUZ_PACKAGE_VERSION"
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_RUN_ATTEMPT" -lt 1000
          HORMUZ_BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))
          printf 'version=%s\nbuild_number=%s\nbundle_identifier=%s\n' \
            "$HORMUZ_INPUT_VERSION" "$HORMUZ_BUILD_NUMBER" "$HORMUZ_BUNDLE_ID" \
            >> "$GITHUB_OUTPUT"
      - name: Download the unsigned payload from the isolated build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hormuz-macos-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/hormuz-unsigned-payload
      - name: Verify the exact unsigned payload before credential access
        env:
          HORMUZ_VERSION: ${{ steps.release.outputs.version }}
          HORMUZ_BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
          HORMUZ_BUNDLE_ID: ${{ steps.release.outputs.bundle_identifier }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/hormuz-unsigned-payload" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          payload = Path(sys.argv[1])
          binary = payload / "Hormuz"
          manifest_path = payload / "payload-manifest.json"
          helpers = {
              "arm64": payload / "context-helpers/hormuz-context-arm64",
          }
          tokenizers = {
              "9b5ad71b2ce5302211f9c61530b329a4922fc6a4": payload / "context-tokenizers/9b5ad71b2ce5302211f9c61530b329a4922fc6a4",
              "fb374d419588a4632f3f557e76b4b70aebbca790": payload / "context-tokenizers/fb374d419588a4632f3f557e76b4b70aebbca790",
          }
          expected_tokenizers = {
              "9b5ad71b2ce5302211f9c61530b329a4922fc6a4": "223921b76ee99bde995b7ff738513eef100fb51d18c93597a113bcffe865b2a7",
              "fb374d419588a4632f3f557e76b4b70aebbca790": "446a9538cb6c348e3516120d7c08b09f57c36495e2acfffe59a5bf8b0cfb1a2d",
          }
          expected_top_level = {"Hormuz", "context-helpers", "context-tokenizers", "payload-manifest.json"}
          if (payload / "Hormuz.dSYM").is_dir():
              expected_top_level.add("Hormuz.dSYM")
          if {path.name for path in payload.iterdir()} != expected_top_level:
              raise SystemExit("unsigned payload contains unexpected files")
          if any(not path.is_file() or path.is_symlink() for path in [binary, manifest_path, *helpers.values(), *tokenizers.values()]):
              raise SystemExit("unsigned payload is missing or unsafe")
          if {path.name for path in (payload / "context-helpers").iterdir()} != {path.name for path in helpers.values()}:
              raise SystemExit("unsigned helper payload contains unexpected files")
          if {path.name for path in (payload / "context-tokenizers").iterdir()} != set(tokenizers):
              raise SystemExit("unsigned tokenizer payload contains unexpected files")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          architectures = sorted(
              subprocess.check_output(
                  ["lipo", "-archs", str(binary)], text=True
              ).split()
          )
          helper_architectures = {
              name: sorted(subprocess.check_output(["lipo", "-archs", str(path)], text=True).split())
              for name, path in helpers.items()
          }
          tokenizer_digests = {
              name: hashlib.sha256(path.read_bytes()).hexdigest()
              for name, path in tokenizers.items()
          }
          expected = {
              "schema_id": "hormuz.macos-unsigned-payload",
              "schema_version": 2,
              "source_commit": os.environ["GITHUB_SHA"],
              "bundle_identifier": os.environ["HORMUZ_BUNDLE_ID"],
              "version": os.environ["HORMUZ_VERSION"],
              "build": os.environ["HORMUZ_BUILD_NUMBER"],
              "architectures": ["arm64"],
              "binary_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              "context_helper_architectures": {"arm64": ["arm64"]},
              "context_helper_sha256": {
                  name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for name, path in helpers.items()
              },
              "context_tokenizer_sha256": expected_tokenizers,
              "credential_free_runtime_version_verified": True,
              "credential_free_context_helper_verified": True,
          }
          if (
              manifest != expected
              or architectures != ["arm64"]
              or helper_architectures != expected["context_helper_architectures"]
              or tokenizer_digests != expected_tokenizers
          ):
              raise SystemExit("unsigned payload identity changed")
          PY
          for HORMUZ_CONTEXT_SIGNATURE_INPUT in \
            "arm64:$RUNNER_TEMP/hormuz-unsigned-payload/context-helpers/hormuz-context-arm64"; do
            HORMUZ_CONTEXT_SIGNATURE_ARCH="${HORMUZ_CONTEXT_SIGNATURE_INPUT%%:*}"
            HORMUZ_CONTEXT_SIGNATURE_PATH="${HORMUZ_CONTEXT_SIGNATURE_INPUT#*:}"
            codesign --verify --strict --verbose=4 "$HORMUZ_CONTEXT_SIGNATURE_PATH"
            HORMUZ_CONTEXT_SIGNATURE_DETAILS="$(codesign -dvvv "$HORMUZ_CONTEXT_SIGNATURE_PATH" 2>&1)"
            printf '%s\n' "$HORMUZ_CONTEXT_SIGNATURE_DETAILS" | \
              grep -Fqx "Identifier=$HORMUZ_BUNDLE_ID.context-helper.$HORMUZ_CONTEXT_SIGNATURE_ARCH"
            printf '%s\n' "$HORMUZ_CONTEXT_SIGNATURE_DETAILS" | grep -Fqx 'TeamIdentifier=R267LZMUTY'
            printf '%s\n' "$HORMUZ_CONTEXT_SIGNATURE_DETAILS" | grep -Eq '^CodeDirectory .*flags=.*runtime'
            printf '%s\n' "$HORMUZ_CONTEXT_SIGNATURE_DETAILS" | grep -Eq '^Timestamp=.+$'
          done
      - name: Import protected Apple credentials, sign and notarize
        env:
          HORMUZ_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          HORMUZ_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          HORMUZ_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          HORMUZ_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          HORMUZ_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          HORMUZ_VERSION: ${{ steps.release.outputs.version }}
          HORMUZ_BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
          HORMUZ_BUNDLE_ID: ${{ steps.release.outputs.bundle_identifier }}
          HORMUZ_TEAM_ID: R267LZMUTY
          HORMUZ_UNSIGNED_PAYLOAD: ${{ runner.temp }}/hormuz-unsigned-payload
          HORMUZ_SOURCE_COMMIT: ${{ github.sha }}
          HORMUZ_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          umask 077
          for name in HORMUZ_CERTIFICATE_BASE64 HORMUZ_CERTIFICATE_PASSWORD HORMUZ_NOTARY_KEY_BASE64 HORMUZ_NOTARY_KEY_ID HORMUZ_NOTARY_ISSUER_ID; do
            test -n "${!name}"
          done
          HORMUZ_KEYCHAIN="$RUNNER_TEMP/hormuz-signing.keychain-db"
          HORMUZ_CERTIFICATE="$RUNNER_TEMP/developer-id.p12"
          HORMUZ_NOTARY_KEY="$RUNNER_TEMP/AuthKey_$HORMUZ_NOTARY_KEY_ID.p8"
          export HORMUZ_CERTIFICATE HORMUZ_NOTARY_KEY
          HORMUZ_KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          HORMUZ_NOTARY_PROFILE="hormuz-ci-$GITHUB_RUN_ID"
          cleanup() {
            security delete-keychain "$HORMUZ_KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$HORMUZ_CERTIFICATE" "$HORMUZ_NOTARY_KEY"
          }
          trap cleanup EXIT
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path(os.environ["HORMUZ_CERTIFICATE"]).write_bytes(base64.b64decode(os.environ["HORMUZ_CERTIFICATE_BASE64"], validate=True))
          Path(os.environ["HORMUZ_NOTARY_KEY"]).write_bytes(base64.b64decode(os.environ["HORMUZ_NOTARY_KEY_BASE64"], validate=True))
          PY
          security create-keychain -p "$HORMUZ_KEYCHAIN_PASSWORD" "$HORMUZ_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$HORMUZ_KEYCHAIN"
          security unlock-keychain -p "$HORMUZ_KEYCHAIN_PASSWORD" "$HORMUZ_KEYCHAIN"
          security import "$HORMUZ_CERTIFICATE" -k "$HORMUZ_KEYCHAIN" -P "$HORMUZ_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$HORMUZ_KEYCHAIN_PASSWORD" "$HORMUZ_KEYCHAIN"
          security list-keychains -d user -s "$HORMUZ_KEYCHAIN"
          security default-keychain -d user -s "$HORMUZ_KEYCHAIN"
          HORMUZ_IDENTITIES="$(security find-identity -v -p codesigning "$HORMUZ_KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: [^"]*\)"/\1/p')"
          test "$(printf '%s\n' "$HORMUZ_IDENTITIES" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          HORMUZ_CODESIGN_IDENTITY="$HORMUZ_IDENTITIES"
          [[ "$HORMUZ_CODESIGN_IDENTITY" == *"($HORMUZ_TEAM_ID)" ]]
          xcrun notarytool store-credentials "$HORMUZ_NOTARY_PROFILE" \
            --key "$HORMUZ_NOTARY_KEY" \
            --key-id "$HORMUZ_NOTARY_KEY_ID" \
            --issuer "$HORMUZ_NOTARY_ISSUER_ID" \
            --keychain "$HORMUZ_KEYCHAIN" \
            --validate
          rm -f "$HORMUZ_CERTIFICATE" "$HORMUZ_NOTARY_KEY"
          unset HORMUZ_CERTIFICATE_BASE64 HORMUZ_CERTIFICATE_PASSWORD
          unset HORMUZ_NOTARY_KEY_BASE64 HORMUZ_NOTARY_KEY_ID HORMUZ_NOTARY_ISSUER_ID
          HORMUZ_OUTPUT="$RUNNER_TEMP/hormuz-macos-release"
          HORMUZ_PACKAGE_ARGS=(
            --output-directory "$HORMUZ_OUTPUT"
            --bundle-id "$HORMUZ_BUNDLE_ID"
            --version "$HORMUZ_VERSION"
            --build "$HORMUZ_BUILD_NUMBER"
            --prebuilt-binary "$HORMUZ_UNSIGNED_PAYLOAD/Hormuz"
            --context-helper-directory "$HORMUZ_UNSIGNED_PAYLOAD/context-helpers"
            --tokenizer-cache "$HORMUZ_UNSIGNED_PAYLOAD/context-tokenizers"
          )
          if [ -d "$HORMUZ_UNSIGNED_PAYLOAD/Hormuz.dSYM" ]; then
            HORMUZ_PACKAGE_ARGS+=(--prebuilt-dsym "$HORMUZ_UNSIGNED_PAYLOAD/Hormuz.dSYM")
          fi
          HORMUZ_CODESIGN_IDENTITY="$HORMUZ_CODESIGN_IDENTITY" ./script/package_macos_release.sh \
            "${HORMUZ_PACKAGE_ARGS[@]}"
          ./script/notarize_macos_release.sh \
            --bundle "$HORMUZ_OUTPUT/Hormuz.app" \
            --upload-archive "$HORMUZ_OUTPUT/Hormuz-$HORMUZ_VERSION-notarization-upload.zip" \
            --keychain-profile "$HORMUZ_NOTARY_PROFILE" \
            --keychain "$HORMUZ_KEYCHAIN"
      - name: Retain only the signed notarized archive and content-free evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-macos-${{ inputs.version }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hormuz-macos-release/Hormuz-*-notarized.zip
            ${{ runner.temp }}/hormuz-macos-release/Hormuz-*.dSYM.zip
            ${{ runner.temp }}/hormuz-macos-release/notarization.json
            ${{ runner.temp }}/hormuz-macos-release/distribution-proof.json
          if-no-files-found: error
          retention-days: 30
