name: Release signed container

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24.19.0"
  COSIGN_VERSION: "v3.0.6"

jobs:
  verify:
    name: Verify release source and restricted image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate annotated tag, version, repository, and main ancestry
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          python scripts/release_contract.py validate \
            --tag "$GITHUB_REF_NAME" \
            --ref "$GITHUB_REF" \
            --sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --event "$GITHUB_EVENT_NAME" \
            --project-file pyproject.toml \
            --main-ref origin/main \
            --runner-environment "${{ runner.environment }}" \
            --deny-self-hosted-runners \
            --output "$RUNNER_TEMP/hormuz-release-contract.json"
      - name: Install hash-locked build toolchain
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --requirement deploy/build/requirements.lock
      - name: Install hash-locked runtime dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --requirement deploy/container/requirements.lock
      - name: Install Hormuz runtime
        run: python -m pip install --no-build-isolation --no-deps --editable .
      - name: Verify runtime dependency closure
        run: python -m pip check
      - name: Verify complete source suite
        run: python -m unittest -v
      - name: Verify frozen governed-context release benchmark
        run: |
          python benchmarks/context/generate_corpus.py --check
          hormuz context-benchmark \
            --profile release \
            --iterations 5 \
            --output "$RUNNER_TEMP/context-benchmark-release.json"
      - name: Build and compare independent exact-source distributions
        run: |
          python scripts/reproducible_build.py \
            --source-sha "$GITHUB_SHA" \
            --outdir dist
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Build and compare independent exact-source amd64 OCI layouts
        run: |
          python scripts/reproducible_image.py \
            --source-sha "$GITHUB_SHA" \
            --platform linux/amd64 \
            --outdir "$RUNNER_TEMP/hormuz-reproducible-oci/linux-amd64"
      - name: Build and compare independent exact-source arm64 OCI layouts
        run: |
          python scripts/reproducible_image.py \
            --source-sha "$GITHUB_SHA" \
            --platform linux/arm64 \
            --outdir "$RUNNER_TEMP/hormuz-reproducible-oci/linux-arm64"
      - name: Build restricted release-candidate image
        env:
          HORMUZ_IMAGE: hormuz:release-${{ github.sha }}
        run: |
          HORMUZ_SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          docker build \
            --pull=false \
            --build-arg "HORMUZ_REVISION=$GITHUB_SHA" \
            --build-arg "HORMUZ_VERSION=${GITHUB_REF_NAME#v}" \
            --build-arg "SOURCE_DATE_EPOCH=$HORMUZ_SOURCE_DATE_EPOCH" \
            --tag "$HORMUZ_IMAGE" \
            .
          python3 scripts/container_smoke.py --image "$HORMUZ_IMAGE"
      - name: Generate release-candidate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: hormuz:release-${{ github.sha }}
          scanners: vuln
          format: cyclonedx
          output: ${{ runner.temp }}/hormuz-release.sbom.cdx.json
          exit-code: "0"
      - name: Enforce release-candidate vulnerability gate
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output "$RUNNER_TEMP/hormuz-release-vulnerabilities.json" \
            "hormuz:release-$GITHUB_SHA"
          docker image inspect "hormuz:release-$GITHUB_SHA" \
            > "$RUNNER_TEMP/hormuz-release-image-inspect.json"
      - name: Preserve release verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-release-verification-${{ github.ref_name }}
          path: |
            dist/*
            ${{ runner.temp }}/hormuz-reproducible-oci/
            ${{ runner.temp }}/hormuz-release-contract.json
            ${{ runner.temp }}/context-benchmark-release.json
            ${{ runner.temp }}/hormuz-release.sbom.cdx.json
            ${{ runner.temp }}/hormuz-release-vulnerabilities.json
            ${{ runner.temp }}/hormuz-release-image-inspect.json
          if-no-files-found: error
          retention-days: 30

  client-compatibility:
    name: Verify integrity-locked Codex and Claude Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install hash-locked build toolchain
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --requirement deploy/build/requirements.lock
      - name: Install hash-locked runtime dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --requirement deploy/container/requirements.lock
      - name: Install Hormuz runtime
        run: python -m pip install --no-build-isolation --no-deps --editable .
      - name: Verify runtime dependency closure
        run: python -m pip check
      - name: Validate pinned official-client closure
        run: >-
          python scripts/client_lock_contract.py
          --output "$RUNNER_TEMP/hormuz-client-lock-contract.json"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: deploy/clients/package-lock.json
      - name: Verify exact client toolchain
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
      - name: Install integrity-locked official clients
        run: |
          npm ci --prefix deploy/clients --ignore-scripts --no-audit --no-fund
          node deploy/clients/node_modules/@anthropic-ai/claude-code/install.cjs
          echo "$GITHUB_WORKSPACE/deploy/clients/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Record client versions
        run: |
          node --version
          npm --version
          codex --version
          claude --version
      - name: Verify both clients through Hormuz
        env:
          HORMUZ_RUN_CLAUDE_CLIENT_TEST: "1"
        run: |
          python -m unittest -v \
            tests.test_gateway.GatewayIntegrationTests.test_installed_codex_routes_through_gateway \
            tests.test_gateway.GatewayIntegrationTests.test_official_claude_code_routes_through_gateway
      - name: Preserve pinned-client lock evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-release-pinned-client-lock-${{ github.ref_name }}
          path: ${{ runner.temp }}/hormuz-client-lock-contract.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish, sign, attest, and verify private image
    needs: [verify, client-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.contract.outputs.version }}
      prerelease: ${{ steps.contract.outputs.prerelease }}
      evidence_artifact: hormuz-release-${{ steps.contract.outputs.version }}
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Revalidate the release contract
        id: contract
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          python scripts/release_contract.py validate \
            --tag "$GITHUB_REF_NAME" \
            --ref "$GITHUB_REF" \
            --sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --event "$GITHUB_EVENT_NAME" \
            --project-file pyproject.toml \
            --main-ref origin/main \
            --runner-environment "${{ runner.environment }}" \
            --deny-self-hosted-runners \
            --output "$RUNNER_TEMP/hormuz-release-contract.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Resolve exact source epoch
        id: source_epoch
        shell: bash
        run: |
          value="$(git show -s --format=%ct "$GITHUB_SHA")"
          if [[ ! "$value" =~ ^[0-9]{9,10}$ ]]; then
            echo "release blocked: source epoch is invalid" >&2
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Require owner approval for public Sigstore transparency metadata
        env:
          RELEASE_APPROVAL: ${{ vars.HORMUZ_SIGSTORE_RELEASE_APPROVAL }}
        run: |
          if [ "$RELEASE_APPROVAL" != "sigstore-public-transparency-v1" ]; then
            echo "release blocked: owner approval for public Sigstore metadata is not configured" >&2
            exit 1
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Authenticate to private GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve an existing immutable version alias
        id: existing
        env:
          VERSION_TAG: ${{ steps.contract.outputs.version_tag }}
        run: |
          set +e
          docker buildx imagetools inspect "$VERSION_TAG" \
            --format '{{.Manifest.Digest}}' \
            > "$RUNNER_TEMP/existing-release-digest.txt"
          inspect_status=$?
          set -e
          if [ "$inspect_status" -eq 0 ]; then
            python scripts/release_contract.py parse-digest \
              --input "$RUNNER_TEMP/existing-release-digest.txt" \
              --github-output "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push untagged multi-platform digest candidate
        if: steps.existing.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: false
          outputs: type=image,name=${{ steps.contract.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.contract.outputs.version }}
          build-args: |
            HORMUZ_REVISION=${{ github.sha }}
            HORMUZ_VERSION=${{ steps.contract.outputs.version }}
            SOURCE_DATE_EPOCH=${{ steps.source_epoch.outputs.value }}
          provenance: mode=max
          sbom: true
      - name: Select and validate the release digest
        id: selected
        env:
          EXISTING: ${{ steps.existing.outputs.exists }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "$EXISTING" = "true" ]; then
            echo "$EXISTING_DIGEST" > "$RUNNER_TEMP/selected-release-digest.txt"
          else
            echo "$BUILD_DIGEST" > "$RUNNER_TEMP/selected-release-digest.txt"
          fi
          python scripts/release_contract.py parse-digest \
            --input "$RUNNER_TEMP/selected-release-digest.txt" \
            --github-output "$GITHUB_OUTPUT"
      - name: Verify exact remote image metadata before signing
        env:
          IMAGE: ${{ steps.contract.outputs.image }}
          DIGEST: ${{ steps.selected.outputs.digest }}
          VERSION: ${{ steps.contract.outputs.version }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          docker image inspect "$IMAGE@$DIGEST" \
            > "$RUNNER_TEMP/hormuz-release-image-inspect.json"
          python scripts/release_contract.py validate-image \
            --input "$RUNNER_TEMP/hormuz-release-image-inspect.json" \
            --version "$VERSION" \
            --sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/hormuz-release-image-metadata.json"
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sign exact digest with GitHub OIDC
        env:
          IMAGE: ${{ steps.contract.outputs.image }}
          DIGEST: ${{ steps.selected.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Render content-free SLSA provenance predicate
        run: |
          python scripts/release_contract.py predicate \
            --contract "$RUNNER_TEMP/hormuz-release-contract.json" \
            --dockerfile Dockerfile \
            --dependency-lock deploy/container/requirements.lock \
            --workflow-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/hormuz-slsa-provenance.json"
      - name: Sign SLSA provenance with GitHub OIDC
        env:
          IMAGE: ${{ steps.contract.outputs.image }}
          DIGEST: ${{ steps.selected.outputs.digest }}
        run: |
          cosign attest --yes \
            --type slsaprovenance1 \
            --predicate "$RUNNER_TEMP/hormuz-slsa-provenance.json" \
            "$IMAGE@$DIGEST"
      - name: Verify keyless signature and exact workflow identity
        env:
          IMAGE: ${{ steps.contract.outputs.image }}
          DIGEST: ${{ steps.selected.outputs.digest }}
          SIGNING_IDENTITY: ${{ steps.contract.outputs.signing_identity }}
          OIDC_ISSUER: ${{ steps.contract.outputs.oidc_issuer }}
        run: |
          cosign verify \
            --output json \
            --certificate-identity "$SIGNING_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE@$DIGEST" \
            > "$RUNNER_TEMP/hormuz-cosign-verification.json"
      - name: Verify signed SLSA provenance identity
        env:
          IMAGE: ${{ steps.contract.outputs.image }}
          DIGEST: ${{ steps.selected.outputs.digest }}
          SIGNING_IDENTITY: ${{ steps.contract.outputs.signing_identity }}
          OIDC_ISSUER: ${{ steps.contract.outputs.oidc_issuer }}
        run: |
          cosign verify-attestation \
            --type slsaprovenance1 \
            --certificate-identity "$SIGNING_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            --output json \
            "$IMAGE@$DIGEST" \
            > "$RUNNER_TEMP/hormuz-provenance-verification.json"
          python scripts/release_contract.py validate-provenance \
            --input "$RUNNER_TEMP/hormuz-provenance-verification.json" \
            --predicate "$RUNNER_TEMP/hormuz-slsa-provenance.json" \
            --image "$IMAGE" \
            --digest "$DIGEST" \
            --output "$RUNNER_TEMP/hormuz-slsa-provenance-validated.json"
      - name: Prove package remains private and repository-linked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/hormuz" \
            > "$RUNNER_TEMP/hormuz-package.json"
          python scripts/release_contract.py validate-package \
            --input "$RUNNER_TEMP/hormuz-package.json" \
            --output "$RUNNER_TEMP/hormuz-package-validated.json"
      - name: Promote verified digest to the immutable version alias
        if: steps.existing.outputs.exists != 'true'
        env:
          IMAGE: ${{ steps.contract.outputs.image }}
          VERSION_TAG: ${{ steps.contract.outputs.version_tag }}
          DIGEST: ${{ steps.selected.outputs.digest }}
        run: docker buildx imagetools create --tag "$VERSION_TAG" "$IMAGE@$DIGEST"
      - name: Prove immutable revision alias or create it once
        id: revision-alias
        env:
          IMAGE: ${{ steps.contract.outputs.image }}
          REVISION_TAG: ${{ steps.contract.outputs.revision_tag }}
          DIGEST: ${{ steps.selected.outputs.digest }}
        run: |
          set +e
          docker buildx imagetools inspect "$REVISION_TAG" \
            --format '{{.Manifest.Digest}}' \
            > "$RUNNER_TEMP/revision-alias-digest.txt"
          inspect_status=$?
          set -e
          if [ "$inspect_status" -ne 0 ]; then
            docker buildx imagetools create --tag "$REVISION_TAG" "$IMAGE@$DIGEST"
            docker buildx imagetools inspect "$REVISION_TAG" \
              --format '{{.Manifest.Digest}}' \
              > "$RUNNER_TEMP/revision-alias-digest.txt"
          fi
          python scripts/release_contract.py parse-digest \
            --input "$RUNNER_TEMP/revision-alias-digest.txt" \
            --github-output "$GITHUB_OUTPUT"
          if [ "$DIGEST" != "$(cat "$RUNNER_TEMP/revision-alias-digest.txt")" ]; then
            echo "revision alias did not resolve to the verified digest" >&2
            exit 1
          fi
      - name: Prove version alias resolves to the verified digest
        id: alias
        env:
          VERSION_TAG: ${{ steps.contract.outputs.version_tag }}
          DIGEST: ${{ steps.selected.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$VERSION_TAG" \
            --format '{{.Manifest.Digest}}' \
            > "$RUNNER_TEMP/version-alias-digest.txt"
          python scripts/release_contract.py parse-digest \
            --input "$RUNNER_TEMP/version-alias-digest.txt" \
            --github-output "$GITHUB_OUTPUT"
          if [ "$DIGEST" != "$(cat "$RUNNER_TEMP/version-alias-digest.txt")" ]; then
            echo "version alias did not resolve to the verified digest" >&2
            exit 1
          fi
      - name: Render content-free release evidence
        env:
          DIGEST: ${{ steps.selected.outputs.digest }}
        run: |
          python scripts/release_contract.py evidence \
            --contract "$RUNNER_TEMP/hormuz-release-contract.json" \
            --package "$RUNNER_TEMP/hormuz-package-validated.json" \
            --digest "$DIGEST" \
            --workflow-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --cosign-version "$COSIGN_VERSION" \
            --cosign-verification "$RUNNER_TEMP/hormuz-cosign-verification.json" \
            --provenance-verification "$RUNNER_TEMP/hormuz-provenance-verification.json" \
            --provenance-validation "$RUNNER_TEMP/hormuz-slsa-provenance-validated.json" \
            --output "$RUNNER_TEMP/hormuz-release-evidence.json" \
            --notes-output "$RUNNER_TEMP/hormuz-release-notes.md"
      - name: Preserve signed-release evidence for promotion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hormuz-release-${{ steps.contract.outputs.version }}
          path: |
            ${{ runner.temp }}/hormuz-release-evidence.json
            ${{ runner.temp }}/hormuz-release-notes.md
            ${{ runner.temp }}/hormuz-cosign-verification.json
            ${{ runner.temp }}/hormuz-provenance-verification.json
            ${{ runner.temp }}/hormuz-slsa-provenance.json
            ${{ runner.temp }}/hormuz-slsa-provenance-validated.json
            ${{ runner.temp }}/hormuz-release-image-metadata.json
            ${{ runner.temp }}/hormuz-package-validated.json
          if-no-files-found: error
          retention-days: 90

  github-release:
    name: Publish verified GitHub release evidence
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.publish.outputs.evidence_artifact }}
          path: ${{ runner.temp }}/hormuz-release
      - name: Create or verify the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.publish.outputs.version }}
          PRERELEASE: ${{ needs.publish.outputs.prerelease }}
          RELEASE_ROOT: ${{ runner.temp }}/hormuz-release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" \
              "$RELEASE_ROOT/hormuz-release-evidence.json" \
              "$RELEASE_ROOT/hormuz-cosign-verification.json" \
              "$RELEASE_ROOT/hormuz-provenance-verification.json" \
              "$RELEASE_ROOT/hormuz-slsa-provenance.json" \
              "$RELEASE_ROOT/hormuz-slsa-provenance-validated.json" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            release_kind=()
            if [ "$PRERELEASE" = "true" ]; then
              release_kind+=(--prerelease)
            fi
            gh release create "$TAG" \
              "$RELEASE_ROOT/hormuz-release-evidence.json" \
              "$RELEASE_ROOT/hormuz-cosign-verification.json" \
              "$RELEASE_ROOT/hormuz-provenance-verification.json" \
              "$RELEASE_ROOT/hormuz-slsa-provenance.json" \
              "$RELEASE_ROOT/hormuz-slsa-provenance-validated.json" \
              --verify-tag \
              --title "Hormuz $VERSION" \
              --notes-file "$RELEASE_ROOT/hormuz-release-notes.md" \
              "${release_kind[@]}" \
              --repo "$GITHUB_REPOSITORY"
          fi
