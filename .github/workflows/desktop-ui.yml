name: Desktop UI simulation

on:
  pull_request:
    paths: ['clients/desktop/**', '.github/workflows/desktop-ui.yml']
  push:
    branches: [main]
    paths: ['clients/desktop/**', '.github/workflows/desktop-ui.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Simulated desktop UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/desktop
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit --fetch-retries=2 --fetch-timeout=20000 --maxsockets=4
      - name: Check components and types
        run: npm run check
      - name: Check source formatting
        run: npm run format:check
      - name: Test routing, privacy and owned work with mock timers
        run: npm test
      - name: Build the frontend simulation
        run: npm run build
