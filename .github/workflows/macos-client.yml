name: Mac client

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "clients/macos/**"
      - "clients/rust/**"
      - "script/build_and_run.sh"
      - "script/package_macos_release.sh"
      - "script/notarize_macos_release.sh"
      - "tools/verify_macos_client.py"
      - "tools/verify_macos_distribution.py"
      - "tools/verify_macos_pilot_evidence.py"
      - "tools/build_context_helper.sh"
      - "tools/context_helper_entry.py"
      - "tests/test_macos_distribution_verifier.py"
      - "tests/test_macos_pilot_evidence.py"
      - "tests/test_client_relay.py"
      - "tests/test_context_relay_bridge.py"
      - "tests/test_native_macos_relay.py"
      - "tests/test_compaction*.py"
      - "tools/verify_macos_installed_client.py"
      - "pyproject.toml"
      - "hormuz/**"
      - "tests/_session_fixtures.py"
      - "tests/test_gateway.py"
      - ".github/workflows/macos-client.yml"
      - ".github/workflows/macos-distribution.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect native Mac changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      macos: ${{ steps.scope.outputs.macos }}
    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine whether native verification is required
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            clients/macos \
            clients/rust \
            script/build_and_run.sh \
            script/package_macos_release.sh \
            script/notarize_macos_release.sh \
            tools/verify_macos_client.py \
            tools/verify_macos_distribution.py \
            tools/verify_macos_pilot_evidence.py \
            tools/build_context_helper.sh \
            tools/context_helper_entry.py \
            tools/verify_macos_installed_client.py \
            tests/_session_fixtures.py \
            tests/test_client_relay.py \
            tests/test_context_relay_bridge.py \
            tests/test_native_macos_relay.py \
            tests/test_compaction*.py \
            tests/test_gateway.py \
            tests/test_macos_distribution_verifier.py \
            tests/test_macos_pilot_evidence.py \
            pyproject.toml \
            hormuz \
            .github/workflows/macos-client.yml \
            .github/workflows/macos-distribution.yml; then
            echo "macos=false" >> "$GITHUB_OUTPUT"
          else
            echo "macos=true" >> "$GITHUB_OUTPUT"
          fi

  context-helper:
    name: Context helper (${{ matrix.architecture }})
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build native standalone context helper
        env:
          HORMUZ_CONTEXT_ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check '.[context-build]'
          ./tools/build_context_helper.sh "$(command -v python)" \
            "$RUNNER_TEMP/context-helper-build" "$HORMUZ_CONTEXT_ARCH"
          mkdir "$RUNNER_TEMP/context-helper-artifact"
          cp "$RUNNER_TEMP/context-helper-build/dist/hormuz-context" \
            "$RUNNER_TEMP/context-helper-artifact/hormuz-context-$HORMUZ_CONTEXT_ARCH"
      - name: Set up Node.js for packaged-client conformance
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Prove actual Codex On and Off paths through the packaged helper
        env:
          HORMUZ_CONTEXT_ARCH: ${{ matrix.architecture }}
          HORMUZ_RUN_CONTEXT_CLIENT_TEST: "1"
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/hormuz-context-client" \
            --no-package-lock --no-save '@openai/codex@0.147.0'
          python -m hormuz context resources install \
            --directory "$RUNNER_TEMP/context-tokenizers"
          PATH="$RUNNER_TEMP/hormuz-context-client/node_modules/.bin:$PATH" \
            HORMUZ_CONTEXT_TOKENIZER_CACHE="$RUNNER_TEMP/context-tokenizers" \
            HORMUZ_PACKAGED_CONTEXT_HELPER="$RUNNER_TEMP/context-helper-artifact/hormuz-context-$HORMUZ_CONTEXT_ARCH" \
            python -m unittest -v \
              tests.test_client_relay.RelayTests.test_official_codex_exec_command_output_is_compacted_through_relay
      - name: Transfer architecture-bound helper
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hormuz-context-helper-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/context-helper-artifact/hormuz-context-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 1

  native-client:
    name: Native Mac client verification
    needs: [changes, context-helper]
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Record native toolchain
        run: |
          test "$(uname -m)" = arm64
          swift --version
          xcodebuild -version
      - name: Install pinned Rust toolchain
        working-directory: clients/rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Test native session and storage contracts
        run: swift test --package-path clients/macos
      - name: Install client feature dependencies
        run: python -m pip install --disable-pip-version-check --editable '.[context]'
      - name: Download the standalone Apple Silicon helper
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hormuz-context-helper-*-${{ github.sha }}
          path: ${{ runner.temp }}/hormuz-context-helpers
          merge-multiple: true
      - name: Install pinned tokenizer resources explicitly
        run: >-
          python -m hormuz context resources install
          --directory "$RUNNER_TEMP/hormuz-context-tokenizers"
      - name: Stage and inspect the local app bundle
        run: |
          ./script/build_and_run.sh --build-only
          clients/macos/dist/Hormuz.app/Contents/MacOS/Hormuz --version
          codesign --verify --strict clients/macos/dist/Hormuz.app
          plutil -lint clients/macos/dist/Hormuz.app/Contents/Info.plist
      - name: Prove the Apple Silicon distribution-shaped package
        id: package
        run: >-
          ./script/package_macos_release.sh
          --ad-hoc
          --bundle-id com.xpounder.hormuz
          --build 1
          --context-helper-directory "$RUNNER_TEMP/hormuz-context-helpers"
          --tokenizer-cache "$RUNNER_TEMP/hormuz-context-tokenizers"
          --output-directory "$RUNNER_TEMP/hormuz-macos-package"
      - name: Set up Node.js for native launch conformance
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Verify packaged Rust relay with pinned official clients
        id: official_clients
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/hormuz-native-clients" \
            --no-package-lock --no-save '@openai/codex@0.147.0' '@anthropic-ai/claude-code@2.1.233'
          mkdir "$RUNNER_TEMP/hormuz-native-archive"
          HORMUZ_PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python tools/verify_macos_distribution.py \
            --bundle "$RUNNER_TEMP/hormuz-macos-package/Hormuz.app" \
            --archive "$RUNNER_TEMP/hormuz-macos-package/Hormuz-$HORMUZ_PACKAGE_VERSION-local-validation.zip" \
            --mode ad-hoc --expected-bundle-id com.xpounder.hormuz \
            --expected-version "$HORMUZ_PACKAGE_VERSION" --expected-build 1 \
            --verify-executable-version --verify-context-helper \
            --source-commit "${{ github.sha }}" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output "$RUNNER_TEMP/hormuz-macos-package/package-metadata.json"
          ditto -x -k "$RUNNER_TEMP/hormuz-macos-package/Hormuz-$HORMUZ_PACKAGE_VERSION-local-validation.zip" \
            "$RUNNER_TEMP/hormuz-native-archive"
          HORMUZ_NATIVE_RELAY_BINARY="$RUNNER_TEMP/hormuz-native-archive/Hormuz.app/Contents/Helpers/hormuz-client-relay" \
            HORMUZ_NATIVE_OPTIMIZER_HELPER="$RUNNER_TEMP/hormuz-native-archive/Hormuz.app/Contents/Resources/ContextHelper/hormuz-context" \
            HORMUZ_NATIVE_CREDENTIAL_HELPER="$RUNNER_TEMP/hormuz-native-archive/Hormuz.app/Contents/MacOS/Hormuz" \
            HORMUZ_NATIVE_OFFICIAL_CLIENT_DIRECTORY="$RUNNER_TEMP/hormuz-native-clients/node_modules/.bin" \
            python -m unittest -v tests.test_native_macos_relay
      - name: Test distribution archive contracts
        id: archive_contracts
        run: python -m unittest tests.test_macos_distribution_verifier tests.test_macos_pilot_evidence
      - name: Test local optimizer and relay contracts
        id: local_contracts
        run: >-
          python -m unittest
          tests.test_compaction
          tests.test_compaction_runtime
          tests.test_compaction_enforcement
          tests.test_compaction_cli
          tests.test_client_relay
          tests.test_context_relay_bridge
      - name: Verify native client against the local gateway
        id: local_gateway
        run: >-
          python tools/verify_macos_client.py
          --probe clients/macos/.build/debug/HormuzFixtureProbe
          --output "$RUNNER_TEMP/hormuz-macos-local-proof.json"
      - name: Bind the ad-hoc candidate to source and observed test outcomes
        id: candidate
        if: always() && steps.package.outcome == 'success'
        env:
          HORMUZ_PACKAGE_DIRECTORY: ${{ runner.temp }}/hormuz-macos-package
          HORMUZ_CHECKOUT_COMMIT: ${{ github.sha }}
          HORMUZ_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          HORMUZ_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HORMUZ_JOB_STATUS: ${{ job.status }}
          HORMUZ_OFFICIAL_CLIENT_OUTCOME: ${{ steps.official_clients.outcome }}
          HORMUZ_ARCHIVE_CONTRACT_OUTCOME: ${{ steps.archive_contracts.outcome }}
          HORMUZ_LOCAL_CONTRACT_OUTCOME: ${{ steps.local_contracts.outcome }}
          HORMUZ_LOCAL_GATEWAY_OUTCOME: ${{ steps.local_gateway.outcome }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          package = Path(os.environ["HORMUZ_PACKAGE_DIRECTORY"])
          archives = list(package.glob("Hormuz-*-local-validation.zip"))
          if len(archives) != 1 or not archives[0].is_file() or archives[0].is_symlink():
              raise SystemExit("candidate_archive_unavailable")
          archive = archives[0]
          metadata = json.loads((package / "package-metadata.json").read_text())
          with archive.open("rb") as stream:
              archive_digest = hashlib.file_digest(stream, "sha256").hexdigest()
          if metadata.get("mode") != "ad-hoc" or metadata.get("distribution_ready") is not False:
              raise SystemExit("candidate_mode_invalid")
          if metadata.get("archive_sha256") != archive_digest:
              raise SystemExit("candidate_archive_digest_mismatch")
          def revision(ref):
              result = subprocess.run(["git", "rev-parse", "--verify", ref],
                  capture_output=True, text=True, timeout=5)
              return result.stdout.strip() if result.returncode == 0 else None
          checkout = revision("HEAD")
          if checkout != os.environ["HORMUZ_CHECKOUT_COMMIT"]:
              raise SystemExit("candidate_checkout_mismatch")
          for field, expected in (("source_commit", checkout),
                  ("workflow_run_url", os.environ["HORMUZ_RUN_URL"])):
              if field in metadata and metadata[field] != expected:
                  raise SystemExit("candidate_metadata_provenance_mismatch")
          head = os.environ["HORMUZ_CANDIDATE_HEAD"]
          proof = {
              "schema_id": "hormuz.macos-ad-hoc-candidate", "schema_version": 1,
              "checkout_commit": checkout, "checkout_tree": revision("HEAD^{tree}"),
              "candidate_head": head, "candidate_tree_if_available": revision(head + "^{tree}"),
              "workflow_run_url": os.environ["HORMUZ_RUN_URL"],
              "package_metadata_has_source_provenance": "source_commit" in metadata,
              "archive": archive.name, "archive_sha256": archive_digest,
              "executable_sha256": metadata["executable_sha256"],
              "native_relay_sha256": metadata["native_relay_sha256"],
              "context_helper_backend_sha256": metadata["context_helper_backend_sha256"],
              "job_status_at_capture": os.environ["HORMUZ_JOB_STATUS"],
              "step_outcomes": {name: os.environ[variable] for name, variable in (
                  ("official_clients", "HORMUZ_OFFICIAL_CLIENT_OUTCOME"),
                  ("archive_contracts", "HORMUZ_ARCHIVE_CONTRACT_OUTCOME"),
                  ("local_contracts", "HORMUZ_LOCAL_CONTRACT_OUTCOME"),
                  ("local_gateway", "HORMUZ_LOCAL_GATEWAY_OUTCOME"))},
              "distribution_ready": False, "customer_release_qualified": False,
              "scope": "Ad-hoc candidate bytes only; native outcomes and final job result require separate review."
          }
          (package / "candidate-provenance.json").write_text(json.dumps(proof, indent=2) + "\n")
          PY
      - name: Retain the ad-hoc candidate for inspection
        if: always() && steps.candidate.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hormuz-macos-ad-hoc-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hormuz-macos-package/Hormuz-*-local-validation.zip
            ${{ runner.temp }}/hormuz-macos-package/package-metadata.json
            ${{ runner.temp }}/hormuz-macos-package/candidate-provenance.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain metadata-only verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hormuz-macos-local-proof
          path: |
            ${{ runner.temp }}/hormuz-macos-local-proof.json
            ${{ runner.temp }}/hormuz-macos-package/package-metadata.json
          if-no-files-found: error
          retention-days: 7

  native-client-gate:
    name: Native Mac client and loopback contract
    if: always()
    needs: [changes, context-helper, native-client]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require native verification for relevant changes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          NATIVE_REQUIRED: ${{ needs.changes.outputs.macos }}
          HELPER_RESULT: ${{ needs.context-helper.result }}
          NATIVE_RESULT: ${{ needs.native-client.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          if [ "$NATIVE_REQUIRED" = "true" ]; then
            test "$HELPER_RESULT" = "success"
            test "$NATIVE_RESULT" = "success"
          else
            test "$NATIVE_REQUIRED" = "false"
            test "$HELPER_RESULT" = "skipped"
            test "$NATIVE_RESULT" = "skipped"
          fi
