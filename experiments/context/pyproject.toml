[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hormuz-context-experiment"
version = "0.1.0"
description = "Deprecated experimental context-pack tooling separated from the Hormuz core gateway."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  { name = "NeuralInt" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security"
]
dependencies = [
  "hormuz>=1.0.0,<1.1.0"
]

[project.scripts]
hormuz-context-experiment = "hormuz_context_experiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hormuz_context_experiment*"]
