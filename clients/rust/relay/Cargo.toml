[package]
name = "hormuz-client-relay"
version = "1.6.0-dev.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "On-demand governed AI client launcher and bounded local streaming relay."

[dependencies]
hormuz-client-core = { path = "../core" }
hormuz-client-platform = { path = "../platform" }
hormuz-client-session = { path = "../session" }
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = "2.6"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time", "io-util"] }
tempfile = "3"
zeroize = "1.8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }
