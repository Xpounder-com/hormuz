[package]
name = "hormuz-client-desktop"
version = "1.5.0-dev.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared bounded desktop session worker and credential-free presentation."

[dependencies]
hormuz-client-core = { path = "../core" }
hormuz-client-platform = { path = "../platform" }
hormuz-client-session = { path = "../session" }
hormuz-client-interaction = { path = "../interaction" }
serde_json.workspace = true
getrandom = "0.4"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
hormuz-client-transport = { path = "../transport" }
tempfile = "3"
