[package]
name = "hormuz-context-optimizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Separately qualified, on-demand lossless context optimizer."

[dependencies]
hormuz-client-core = { path = "../core" }
base64 = "0.22"
rustc-hash = "2"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "blocking"] }
ryu = "1"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
shlex = "1"
tiktoken-rs = "=0.12.1"
unicode-general-category.workspace = true

[dev-dependencies]
tempfile = "3"
