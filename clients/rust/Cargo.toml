[workspace]
members = ["core", "platform", "transport"]
resolver = "2"

[workspace.package]
version = "1.4.0-dev.1"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
url = "2.5.8"
unicode-general-category = "1.1.0"
