[package]
name = "hormuz-linux"
version = "1.5.0-dev.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "GTK4 Linux companion using the shared native session worker."

[features]
default = []
gtk-ui = ["dep:gtk", "dep:async-channel", "dep:libc", "dep:getrandom", "dep:hormuz-client-relay"]

[dependencies]
hormuz-client-core = { path = "../core" }
hormuz-client-platform = { path = "../platform" }
hormuz-client-session = { path = "../session" }
hormuz-client-desktop = { path = "../desktop" }
hormuz-client-interaction = { path = "../interaction" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { package = "gtk4", version = "0.11.5", optional = true, default-features = false }
async-channel = { version = "2", optional = true }
libc = { version = "0.2", optional = true }
getrandom = { version = "0.4", optional = true }
hormuz-client-relay = { path = "../relay", optional = true }

[dev-dependencies]
hormuz-client-transport = { path = "../transport" }
serde_json.workspace = true
time = { version = "0.3", features = ["formatting"] }
tempfile = "3"
