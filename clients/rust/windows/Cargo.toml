[package]
name = "hormuz-windows"
version = "1.5.0-dev.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Native Windows companion integration with explicitly synthetic preview mode."

[dependencies]
hormuz-client-core = { path = "../core" }
hormuz-client-interaction = { path = "../interaction" }
hormuz-client-platform = { path = "../platform" }
hormuz-client-session = { path = "../session" }
serde_json.workspace = true
getrandom = "0.4"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
hormuz-client-transport = { path = "../transport" }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
