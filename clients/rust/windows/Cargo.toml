[package]
name = "hormuz-windows"
version = "1.5.0-dev.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Native Windows companion integration with explicitly synthetic preview mode."

[target.'cfg(windows)'.dependencies]
hormuz-client-core = { path = "../core" }
hormuz-client-platform = { path = "../platform" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
