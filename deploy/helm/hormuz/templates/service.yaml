apiVersion: v1
kind: Service
metadata:
  name: {{ include "hormuz.fullname" . }}
  labels:
    {{- include "hormuz.labels" . | nindent 4 }}
  annotations:
    io.hormuz/exposure: private-cluster-only
spec:
  type: ClusterIP
  selector:
    {{- include "hormuz.selectorLabels" . | nindent 4 }}
  ports:
    - name: http-private
      port: {{ .Values.service.port }}
      targetPort: http-private
      protocol: TCP
