apiVersion: v1
kind: Pod
metadata:
  name: hormuz-disaster-recovery-state
  labels:
    io.hormuz.proof-role: disaster-recovery-state
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: state
      image: ghcr.io/xpounder-com/hormuz@sha256:1bbcca3490a7a5b004a880f42e8250acb91ce566a9c59f3263d7b279568efb5a
      command: ["/opt/hormuz/bin/python"]
      args: ["-I", "-c", "import time; time.sleep(7200)"]
      env:
        - name: HORMUZ_CONFIG
          value: /etc/hormuz-recovery/state-config.json
        - name: HORMUZ_POSTGRES_DSN
          valueFrom:
            secretKeyRef:
              name: hormuz-disaster-recovery-state
              key: postgres-runtime-dsn
        - name: HORMUZ_POSTGRES_MIGRATION_DSN
          valueFrom:
            secretKeyRef:
              name: hormuz-disaster-recovery-state
              key: postgres-migration-dsn
        - name: HORMUZ_POLICY_CONTROL_DSN
          valueFrom:
            secretKeyRef:
              name: hormuz-disaster-recovery-state
              key: postgres-policy-control-dsn
        - name: HORMUZ_CUSTODY_CONTROL_DSN
          valueFrom:
            secretKeyRef:
              name: hormuz-disaster-recovery-state
              key: postgres-custody-control-dsn
        - name: HORMUZ_CUSTODY_EXECUTOR_DSN
          valueFrom:
            secretKeyRef:
              name: hormuz-disaster-recovery-state
              key: postgres-custody-executor-dsn
        - name: HORMUZ_TOKEN
          valueFrom:
            secretKeyRef:
              name: hormuz-disaster-recovery-state
              key: alice-token
        - name: HORMUZ_BOB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hormuz-disaster-recovery-state
              key: bob-token
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: hormuz-disaster-recovery-state
              key: openai-api-key
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: hormuz-disaster-recovery-state
              key: anthropic-api-key
        - name: HORMUZ_OPENBAO_TOKEN
          valueFrom:
            secretKeyRef:
              name: hormuz-disaster-recovery-state
              key: openbao-token
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 1Gi
      volumeMounts:
        - name: state-config
          mountPath: /etc/hormuz-recovery
          readOnly: true
        - name: state-script
          mountPath: /opt/hormuz-proof/state_probe.py
          subPath: state_probe.py
          readOnly: true
        - name: temporary
          mountPath: /tmp
  volumes:
    - name: state-config
      configMap:
        name: hormuz-disaster-recovery-state-config
        defaultMode: 0440
    - name: state-script
      configMap:
        name: hormuz-disaster-recovery-state-script
        defaultMode: 0440
    - name: temporary
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
