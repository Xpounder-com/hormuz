apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-provider
  namespace: hormuz-dependencies
  labels:
    io.hormuz.proof-role: fake-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      io.hormuz.proof-role: fake-provider
  template:
    metadata:
      labels:
        io.hormuz.proof-role: fake-provider
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provider
          image: ghcr.io/xpounder-com/hormuz@sha256:8ac24f5c7afb8ce09ec133616de06702f568a2e70594d8034146a131d86e5b67
          command: ["/opt/hormuz/bin/python"]
          args: ["-I", "/opt/hormuz-proof/fake-provider.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          volumeMounts:
            - name: script
              mountPath: /opt/hormuz-proof
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: fake-provider-v1
            defaultMode: 0440
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fake-provider
  namespace: hormuz-dependencies
spec:
  type: ClusterIP
  selector:
    io.hormuz.proof-role: fake-provider
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      protocol: TCP
---
