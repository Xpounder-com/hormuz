[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hormuz"
version = "0.1.3"
description = "Enterprise AI gateway policy, usage, and control plane."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  { name = "NeuralInt" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Security"
]
dependencies = [
  "PyJWT[crypto]>=2.13,<3",
  "cryptography>=42"
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.3.4,<3.4",
  "psycopg-pool>=3.3.1,<3.4"
]
aws = [
  "boto3>=1.34,<2"
]
self-hosted = [
  "boto3>=1.34,<2"
]

[project.scripts]
hormuz = "hormuz.cli:main"

[tool.setuptools.packages.find]
include = ["hormuz*"]

[tool.setuptools.package-data]
"hormuz" = ["secret-inventory-v1.json"]
"hormuz.migrations.postgresql" = ["*.sql"]
