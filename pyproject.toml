[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hormuz"
version = "0.1.0"
description = "Enterprise AI gateway for policy, privacy, routing, and usage control."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Xpounder, Inc." }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Security"
]
dependencies = [
  "PyJWT[crypto]>=2.13,<3",
  "keyring>=25.7,<26"
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.3.4,<3.4"
]

[project.scripts]
hormuz = "hormuz.cli:main"

[tool.setuptools.packages.find]
include = ["hormuz*"]

[tool.setuptools.package-data]
"hormuz.benchmark_data" = ["*.json"]
"hormuz.migrations.postgresql" = ["*.sql"]
