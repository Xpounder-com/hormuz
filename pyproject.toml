[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hormuz"
version = "0.2.1"
description = "Enterprise AI gateway policy, usage, and control plane."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "NeuralInt" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Security"
]
dependencies = [
  "PyJWT[crypto]>=2.13,<3"
]

[project.scripts]
hormuz = "hormuz.cli:main"

[tool.setuptools.packages.find]
include = ["hormuz*"]
