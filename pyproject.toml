[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hormuz"
version = "2.0.0a2"
description = "Customer-local routing for existing coding clients."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "NeuralInt"}]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Security"
]
dependencies = ["cryptography>=42"]

[project.scripts]
hormuz = "hormuz.cli:main"

[tool.setuptools.packages.find]
include = ["hormuz*"]

[tool.setuptools.package-data]
"hormuz" = ["*.json", "codex-0160-LICENSE.txt"]
