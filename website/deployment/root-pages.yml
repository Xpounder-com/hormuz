name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Website checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out publication configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate the reviewed source pin
        id: source
        run: node scripts/verify-source-pin.mjs
      - name: Check out the exact public product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Xpounder-com/hormuz
          ref: ${{ steps.source.outputs.revision }}
          path: product
          persist-credentials: false
      - name: Confirm the dedicated root-site configuration
        working-directory: product/website
        run: node --input-type=module -e "import assert from 'node:assert/strict'; import { BASE_PATH, SITE_ORIGIN } from './lib/site.mjs'; assert.equal(BASE_PATH, ''); assert.equal(SITE_ORIGIN, 'https://usehormuz.github.io');"
      - name: Install locked website dependencies
        working-directory: product/website
        run: npm ci --ignore-scripts --no-fund
      - name: Check dependency advisories
        working-directory: product/website
        run: npm audit --audit-level=high
      - name: Test website routes, privacy, claims, and recordings
        working-directory: product/website
        run: npm test
      - name: Test recorder deadlines and source provenance
        working-directory: product/website
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build the canonical root export
        working-directory: product/website
        run: npm run build
      - name: Type-check the website
        working-directory: product/website
        run: npm run typecheck
      - name: Verify links, assets, canonicals, and downloads
        working-directory: product/website
        run: npm run verify
      - name: Include the validated public source pin in the artifact
        run: cp site-source.json product/website/out/site-source.json
      - name: Upload the verified root-site artifact
        if: github.repository == 'usehormuz/usehormuz.github.io' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: product/website/out

  deploy:
    name: Publish Hormuz website
    if: github.repository == 'usehormuz/usehormuz.github.io' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - name: Deploy the verified root-site artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify:
    name: Verify live website
    if: github.repository == 'usehormuz/usehormuz.github.io' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the expected publication pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Verify the public source pin, routes, metadata, and downloads
        run: node scripts/verify-live-site.mjs
